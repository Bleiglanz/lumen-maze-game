<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>TAFL — Neon Arcade</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#02000a;color:#dff;
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;touch-action:none;user-select:none}
  canvas{display:block;position:fixed;inset:0}
  #hud{position:fixed;left:0;right:0;top:0;display:grid;grid-template-columns:repeat(4,1fr);
    padding:14px 22px;pointer-events:none;letter-spacing:.18em;font-size:13px;text-transform:uppercase}
  #hud div{text-shadow:0 0 8px var(--glow),0 0 22px var(--glow)}
  #hud div:nth-child(2),#hud div:nth-child(3){text-align:center}
  #hud div:nth-child(4){text-align:right}
  #hud b{display:block;font-size:24px;letter-spacing:.08em;color:#fff;font-variant-numeric:tabular-nums}
  #msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;pointer-events:none;padding:16px}
  #msg h1{margin:0;font-size:clamp(44px,10vw,124px);letter-spacing:.18em;padding-left:.18em;color:#fff;
    text-shadow:0 0 12px #fff,0 0 40px var(--glow),0 0 90px var(--glow2);font-weight:800}
  #msg h2{margin:0;font-size:clamp(28px,6vw,64px);letter-spacing:.3em;padding-left:.3em;color:#fff;
    text-shadow:0 0 12px #fff,0 0 40px var(--glow)}
  #msg p{margin:14px 0 0;letter-spacing:.28em;font-size:clamp(11px,1.6vw,15px);text-transform:uppercase;
    color:#cfe;text-shadow:0 0 10px var(--glow)}
  #msg .blink{animation:bl 1.1s infinite;color:#fff;margin-top:34px}
  @keyframes bl{50%{opacity:.25}}
  #pause{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:48px;
    letter-spacing:.4em;color:#fff;background:rgba(2,0,10,.55);text-shadow:0 0 30px var(--glow)}
  #back{position:fixed;left:16px;bottom:14px;color:#9ef;text-decoration:none;font-size:12px;letter-spacing:.2em;
    text-transform:uppercase;opacity:.7;z-index:5}
  #back:hover{opacity:1}
  .pop{position:fixed;font-weight:800;font-size:22px;pointer-events:none;transform:translate(-50%,-50%);
    animation:pop 1s ease-out forwards;text-shadow:0 0 10px currentColor}
  @keyframes pop{to{transform:translate(-50%,-220%) scale(1.5);opacity:0}}
  .tc{position:fixed;bottom:46px;display:none;gap:10px;z-index:4;grid-auto-flow:column}
  .tc.tl{left:14px;grid-template-columns:repeat(3,58px);grid-auto-flow:row}.tc.tr{right:14px}
  .tc button{width:58px;height:58px;border-radius:14px;border:1px solid var(--glow);background:rgba(10,14,44,.55);
    color:#fff;font-size:20px;font-family:inherit;touch-action:none;box-shadow:inset 0 0 16px -8px var(--glow)}
  .tc button:active{background:rgba(60,200,255,.35)}
  @media (pointer:coarse){.tc{display:grid}}
  .menu{display:grid;grid-template-columns:repeat(2,minmax(0,210px));gap:12px;margin:30px 0 20px;pointer-events:auto}
  .menu button,.hbtn{font:inherit;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:#fff;cursor:pointer;
    padding:14px 10px;border-radius:10px;border:1px solid var(--glow);background:rgba(10,14,44,.85);box-shadow:inset 0 0 18px -8px var(--glow)}
  .menu button:hover,.hbtn:hover{box-shadow:0 0 22px -2px var(--glow),inset 0 0 22px -6px var(--glow)}
  .hbtn{position:fixed;right:16px;bottom:12px;padding:9px 14px;font-size:11px;z-index:5}
  .hbtn.on{background:var(--glow2);color:#02000a}
  :root{--glow:#3df;--glow2:#f4d}
</style>
</head>
<body>
<div id="hud">
  <div><span id="l0"></span><b id="v0"></b></div><div><span id="l1"></span><b id="v1"></b></div>
  <div><span id="l2"></span><b id="v2"></b></div><div><span id="l3"></span><b id="v3"></b></div>
</div>
<div id="msg"></div>
<div id="pause">PAUSED</div>
<a id="back" href="index.html">&larr; games</a>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
'use strict';
/* ================= shared engine: renderer, bloom, particles, audio, input ================= */
const $=id=>document.getElementById(id);
const setMsg=h=>{$('msg').innerHTML=h;};
const setHud=a=>a.forEach((p,i)=>{$('l'+i).textContent=p[0];$('v'+i).textContent=p[1];});
if(!window.THREE){setMsg('<h2>OFFLINE</h2><p>three.js could not be loaded — check your internet connection</p>');throw new Error('three.js missing');}
const rnd=n=>Math.floor(Math.random()*n),rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x02000a);
const camera=new THREE.PerspectiveCamera(50,1,0.1,600);
const cam={pos:new THREE.Vector3(0,0,30),look:new THREE.Vector3(),shake:0};
let onResize=null,onKeyDown=null,onTap=null,muted=false,paused=false;

const dotTex=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');
  const g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'#fff');g.addColorStop(0.3,'rgba(255,255,255,.7)');
  g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);})();

const stars=(()=>{const n=2200,p=new Float32Array(n*3),c=new Float32Array(n*3),col=new THREE.Color();
  for(let i=0;i<n;i++){const r=140+Math.random()*140,a=Math.random()*Math.PI*2,e=Math.asin(Math.random()*2-1);
    p[i*3]=Math.cos(a)*Math.cos(e)*r;p[i*3+1]=Math.sin(e)*r;p[i*3+2]=Math.sin(a)*Math.cos(e)*r;
    col.setHSL(0.5+Math.random()*0.35,0.8,0.5+Math.random()*0.4);c[i*3]=col.r;c[i*3+1]=col.g;c[i*3+2]=col.b;}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));
  g.setAttribute('color',new THREE.BufferAttribute(c,3));
  const s=new THREE.Points(g,new THREE.PointsMaterial({size:2.2,map:dotTex,vertexColors:true,transparent:true,
    blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
  scene.add(s);return s;})();

const PN=1400,pPos=new Float32Array(PN*3),pCol=new Float32Array(PN*3),pVel=new Float32Array(PN*3),
  pBase=new Float32Array(PN*3),pLife=new Float32Array(PN),pMax=new Float32Array(PN);
let pNext=0,pGrav=0;
for(let i=0;i<PN;i++)pPos[i*3+1]=-999;
const pGeo=new THREE.BufferGeometry();
pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
pGeo.setAttribute('color',new THREE.BufferAttribute(pCol,3));
const pPoints=new THREE.Points(pGeo,new THREE.PointsMaterial({size:0.5,map:dotTex,vertexColors:true,transparent:true,
  blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
pPoints.frustumCulled=false;scene.add(pPoints);
const tmpC=new THREE.Color();
function emit(x,y,z,color,n,speed,life){
  tmpC.set(color);
  for(let k=0;k<n;k++){
    const i=pNext;pNext=(pNext+1)%PN;
    const a=Math.random()*Math.PI*2,e=Math.asin(Math.random()*2-1),s=speed*(0.25+Math.random()*0.75);
    pPos[i*3]=x;pPos[i*3+1]=y;pPos[i*3+2]=z;
    pVel[i*3]=Math.cos(a)*Math.cos(e)*s;pVel[i*3+1]=Math.sin(e)*s;pVel[i*3+2]=Math.sin(a)*Math.cos(e)*s;
    pBase[i*3]=tmpC.r;pBase[i*3+1]=tmpC.g;pBase[i*3+2]=tmpC.b;
    pLife[i]=pMax[i]=life*(0.5+Math.random()*0.5);
  }
}
function updateParticles(dt){
  const damp=Math.pow(0.1,dt);
  for(let i=0;i<PN;i++){
    if(pLife[i]<=0)continue;
    pLife[i]-=dt;const j=i*3;
    if(pLife[i]<=0){pPos[j+1]=-999;pCol[j]=pCol[j+1]=pCol[j+2]=0;continue;}
    pVel[j+1]-=pGrav*dt;
    pPos[j]+=pVel[j]*dt;pPos[j+1]+=pVel[j+1]*dt;pPos[j+2]+=pVel[j+2]*dt;
    pVel[j]*=damp;pVel[j+1]*=damp;pVel[j+2]*=damp;
    const f=pLife[i]/pMax[i];
    pCol[j]=pBase[j]*f;pCol[j+1]=pBase[j+1]*f;pCol[j+2]=pBase[j+2]*f;
  }
  pGeo.attributes.position.needsUpdate=true;pGeo.attributes.color.needsUpdate=true;
}

let composer=null,bloom=null;
if(THREE.EffectComposer&&THREE.UnrealBloomPass&&THREE.RenderPass){
  try{
    composer=new THREE.EffectComposer(renderer);
    composer.addPass(new THREE.RenderPass(scene,camera));
    bloom=new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.85,0.5,0.32);
    composer.addPass(bloom);
  }catch(e){composer=null;}
}
function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h);if(composer)composer.setSize(w,h);
  camera.aspect=w/h;camera.updateProjectionMatrix();
  if(onResize)onResize(camera.aspect);
}
addEventListener('resize',resize);

let actx=null;
function audioInit(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(actx&&actx.state==='suspended')actx.resume();}
function tone(f,dur,type,vol,slide){
  if(!actx||muted)return;
  const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(vol||0.08,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+dur+0.02);
}

const keys={};
const pointer={nx:0,ny:0,down:false,moved:false};
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
  audioInit();
  if(k==='p'){paused=!paused;$('pause').style.display=paused?'flex':'none';return;}
  if(k==='m'){muted=!muted;return;}
  const first=!keys[k];keys[k]=true;
  if(onKeyDown&&first&&!paused)onKeyDown(k,e);
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
function setPointer(e){pointer.nx=e.clientX/innerWidth*2-1;pointer.ny=-(e.clientY/innerHeight)*2+1;pointer.moved=true;}
addEventListener('pointermove',setPointer);
addEventListener('pointerdown',e=>{
  if(e.target.closest&&e.target.closest('a,button'))return;
  audioInit();setPointer(e);pointer.down=true;if(onTap&&!paused)onTap(e);
});
addEventListener('pointerup',()=>{pointer.down=false;});
addEventListener('pointercancel',()=>{pointer.down=false;});
const _ray=new THREE.Raycaster(),_v2=new THREE.Vector2(),_hit=new THREE.Vector3();
function pointerOn(plane){_v2.set(pointer.nx,pointer.ny);_ray.setFromCamera(_v2,camera);return _ray.ray.intersectPlane(plane,_hit);}

const _pv=new THREE.Vector3();
function popup(text,x,y,z,color){
  _pv.set(x,y,z).project(camera);
  const el=document.createElement('div');el.className='pop';el.textContent=text;el.style.color=color||'#fff';
  el.style.left=((_pv.x+1)/2*innerWidth)+'px';el.style.top=((1-_pv.y)/2*innerHeight)+'px';
  document.body.appendChild(el);setTimeout(()=>el.remove(),1000);
}
function loadBest(key){try{return +localStorage.getItem(key)||0;}catch(e){return 0;}}
function saveBest(key,v){try{localStorage.setItem(key,v);}catch(e){}}
const hex=c=>'#'+c.toString(16).padStart(6,'0');

// on-screen buttons for touch devices; each one drives a key
function touchKeys(left,right){
  const mk=(arr,cls)=>{if(!arr||!arr.length)return;const d=document.createElement('div');d.className='tc '+cls;
    arr.forEach(([k,l,area])=>{const b=document.createElement('button');b.textContent=l;if(area)b.style.gridArea=area;
      const dn=e=>{e.preventDefault();audioInit();if(!keys[k]){keys[k]=true;if(onKeyDown&&!paused)onKeyDown(k,e);}};
      const up=e=>{e.preventDefault();keys[k]=false;};
      b.addEventListener('pointerdown',dn);b.addEventListener('pointerup',up);
      b.addEventListener('pointerleave',up);b.addEventListener('pointercancel',up);d.appendChild(b);});
    document.body.appendChild(d);};
  mk(left,'tl');mk(right,'tr');
}
const DPAD=[['arrowup','▲','1/2'],['arrowleft','◀','2/1'],['arrowdown','▼','2/2'],['arrowright','▶','2/3']];
const LR=[['arrowleft','◀','1/1'],['arrowright','▶','1/3']];
const coarse=matchMedia('(pointer:coarse)').matches;

function run(update){
  let last=performance.now(),t=0;
  function frame(now){
    requestAnimationFrame(frame);
    const dt=Math.min(0.05,(now-last)/1000);last=now;
    if(!paused){t+=dt;update(dt,t);updateParticles(dt);stars.rotation.y=t*0.006;}
    camera.position.copy(cam.pos);
    if(cam.shake>0){cam.shake=Math.max(0,cam.shake-dt);
      camera.position.x+=(Math.random()-0.5)*cam.shake;camera.position.y+=(Math.random()-0.5)*cam.shake;}
    camera.lookAt(cam.look);
    if(composer)composer.render();else renderer.render(scene,camera);
  }
  resize();requestAnimationFrame(frame);
}

/* ================= TAFL — the Viking siege game: the king runs for the edge, the attackers close the net ================= */
// ---- shared table kit: lights, floor grid, overlay, menus, buttons ----
scene.add(new THREE.AmbientLight(0x8899cc,0.6));{const d=new THREE.DirectionalLight(0xffffff,0.6);d.position.set(3,10,6);scene.add(d);}
const gh=new THREE.GridHelper(160,80,0x1c2c70,0x0e1640);gh.position.y=-4;scene.add(gh);
const P0=new THREE.Plane(new THREE.Vector3(0,1,0),0);
function overlay(html,dim){setMsg(html);$('msg').style.background=html?'rgba(2,0,10,'+(dim||.62)+')':'none';}
const menuHtml=ls=>'<div class="menu">'+ls.map((l,i)=>'<button data-m="'+i+'">'+l+'</button>').join('')+'</div>';
function onMenu(fn){$('msg').addEventListener('click',e=>{const q=e.target.closest('button[data-m]');if(q){audioInit();fn(+q.dataset.m);}});}
let _hb=0;function hbtn(text,fn){const b=document.createElement('button');b.className='hbtn';b.textContent=text;b.style.right=(16+_hb*98)+'px';_hb++;document.body.appendChild(b);b.addEventListener('click',()=>{audioInit();fn();});return b;}
function jingle(win){(win?[523,659,784,1047]:[392,330,262,196]).forEach((f,i)=>setTimeout(()=>tone(f,0.2,'square',0.07),i*130));}
function frameBox(w,d,color,parent){const mat=new THREE.MeshBasicMaterial({color});
  [[w+0.2,0.1,0,d/2+0.05],[w+0.2,0.1,0,-d/2-0.05],[0.1,d+0.2,w/2+0.05,0],[0.1,d+0.2,-w/2-0.05,0]].forEach(f=>{const m=new THREE.Mesh(new THREE.BoxGeometry(f[0],0.1,f[1]),mat);m.position.set(f[2],-0.04,f[3]);(parent||scene).add(m);});return mat;}
function slab(w,d,parent){const m=new THREE.Mesh(new THREE.BoxGeometry(w,0.1,d),new THREE.MeshStandardMaterial({color:0x070b28,emissive:0x0a1040,emissiveIntensity:0.3,roughness:0.6,metalness:0.3}));m.position.y=-0.06;(parent||scene).add(m);return m;}
function textSprite(text,color,px){const cv=document.createElement('canvas');cv.width=512;cv.height=64;const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),transparent:true,depthTest:false}));
  sp.scale.set(8,1,1);sp.userData.set=(t,col)=>{const c=cv.getContext('2d');c.clearRect(0,0,512,64);c.font='bold '+(px||34)+'px sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillStyle=col||color;c.fillText(t,256,34);sp.material.map.needsUpdate=true;};
  sp.userData.set(text);scene.add(sp);return sp;}
const hint=document.createElement('div');hint.style.cssText='position:fixed;left:0;right:0;bottom:54px;text-align:center;letter-spacing:.24em;font-size:12px;text-transform:uppercase;pointer-events:none;color:#fff;text-shadow:0 0 10px #3df;z-index:3';document.body.appendChild(hint);
// a row of on-screen action buttons above the footer; setBar([['label','key'],...]) and each press calls onKeyDown(key)
const _bar=document.createElement('div');_bar.style.cssText='position:fixed;left:0;right:0;bottom:84px;text-align:center;z-index:5';document.body.appendChild(_bar);
_bar.addEventListener('click',e=>{const q=e.target.closest('button');if(q){audioInit();if(onKeyDown)onKeyDown(q.dataset.k);}});
let _barKey='';function setBar(bs){const k=JSON.stringify(bs);if(k===_barKey)return;_barKey=k;_bar.innerHTML=bs.map(b=>'<button class="hbtn" data-k="'+b[1]+'" style="position:static;margin:3px 4px">'+b[0]+'</button>').join('');}
/*LOGIC*/
// 9x9 board. 1 attacker, 2 defender, 3 king. side 1 = attackers (move first), side 2 = defenders
const N=9,NN=81,TH=40,D4=[[1,0],[-1,0],[0,1],[0,-1]],sideOf=v=>v===1?1:v?2:0;
function setup(){const b=new Int8Array(NN),put=(c,r,v)=>b[r*N+c]=v;
  for(const [c,r] of [[3,0],[4,0],[5,0],[4,1]]){put(c,r,1);put(r,c,1);put(8-c,8-r,1);put(8-r,8-c,1);}
  for(const d of [1,2]){put(4,4-d,2);put(4,4+d,2);put(4-d,4,2);put(4+d,4,2);}put(4,4,3);return b;}
function movesT(b,sd){const out=[];for(let s=0;s<NN;s++){if(sideOf(b[s])!==sd)continue;const c=s%N,r=Math.floor(s/N);
    for(const [dc,dr] of D4){let x=c+dc,y=r+dr;while(x>=0&&x<N&&y>=0&&y<N){const t=y*N+x;if(b[t])break;if(t===TH){if(b[s]===3)out.push({f:s,t});break;}out.push({f:s,t});x+=dc;y+=dr;}}}
  return out;}
const hostile=(b,s,sd)=>sideOf(b[s])===sd||(s===TH&&!b[s]);
function kingTaken(b,k){const c=k%N,r=Math.floor(k/N),near=Math.abs(c-4)+Math.abs(r-4)<=1,h=(dc,dr)=>{const x=c+dc,y=r+dr;return x>=0&&x<N&&y>=0&&y<N&&hostile(b,y*N+x,1);};
  return near?h(1,0)&&h(-1,0)&&h(0,1)&&h(0,-1):(h(1,0)&&h(-1,0))||(h(0,1)&&h(0,-1));}
function applyT(b,m){const n=b.slice(),sd=sideOf(n[m.f]);n[m.t]=n[m.f];n[m.f]=0;const c=m.t%N,r=Math.floor(m.t/N);
  for(const [dc,dr] of D4){const ax=c+dc,ay=r+dr;if(ax<0||ax>=N||ay<0||ay>=N)continue;const a=ay*N+ax;if(!n[a]||sideOf(n[a])===sd)continue;
    if(n[a]===3){if(kingTaken(n,a))n[a]=0;continue;}
    const cx=ax+dc,cy=ay+dr;if(cx>=0&&cx<N&&cy>=0&&cy<N&&hostile(n,cy*N+cx,sd)&&n[cy*N+cx]!==3)n[a]=0;}
  return n;}
// 1 = attackers have won, 2 = defenders have won, 0 = still going
function resultT(b){const k=b.indexOf(3);if(k<0)return 1;const c=k%N,r=Math.floor(k/N);return c===0||c===N-1||r===0||r===N-1?2:0;}
function evalT(b){const k=b.indexOf(3);if(k<0)return 10000;const c=k%N,r=Math.floor(k/N);if(c===0||c===N-1||r===0||r===N-1)return -10000;
  let v=0,open=0;for(let s=0;s<NN;s++)v+=b[s]===1?10:b[s]===2?-13:0;
  for(const [dc,dr] of D4){let x=c+dc,y=r+dr,clear=true;while(x>=0&&x<N&&y>=0&&y<N){if(b[y*N+x]){clear=false;break;}x+=dc;y+=dr;}if(clear)open++;
    const ax=c+dc,ay=r+dr;if(ax>=0&&ax<N&&ay>=0&&ay<N&&b[ay*N+ax]===1)v+=7;}
  return v-(open>=2?900:open*70)+Math.min(c,r,8-c,8-r)*5;}
function searchT(b,sd,depth,alpha,beta){const res=resultT(b);if(res)return (res===1?1:-1)*(sd===1?1:-1)*(20000+depth);
  if(depth<=0)return evalT(b)*(sd===1?1:-1);const ms=movesT(b,sd);if(!ms.length)return -(20000+depth);let best=-1e9;
  for(const m of ms){const v=-searchT(applyT(b,m),3-sd,depth-1,-beta,-alpha);if(v>best)best=v;if(v>alpha)alpha=v;if(alpha>=beta)break;}return best;}
function aiPick(b,sd,level){const ms=movesT(b,sd);if(!ms.length)return null;if(level===0&&Math.random()<0.3)return ms[Math.floor(Math.random()*ms.length)];
  let best=-1e9,pick=[];for(const m of ms){const v=-searchT(applyT(b,m),3-sd,level,-1e9,1e9)+Math.random()*3;if(v>best){best=v;pick=[m];}}return pick[0];}
/*ENDLOGIC*/
const KEY='tafl_wins';let wins=loadBest(KEY);
const COL={1:0xff4fd8,2:0x35d9ff,3:0xffd24a},SNAME={1:'ATTACKERS',2:'DEFENDERS'};
let state='title',mode=0,level=1,b=setup(),turn=1,legalMs=[],sel=-1,cur=40,keyNav=false,aiT=0,busy=0,pcs=[],plies=0;
const X=s=>s%N-4,Z=s=>Math.floor(s/N)-4,human=sd=>mode===2||(mode===0?sd===1:sd===2);
onResize=a=>{const k=Math.max(1,1.14/a);cam.pos.set(0,10.8*k,8.4*k);cam.look.set(0,0,0.45);};
const sqG=new THREE.BoxGeometry(0.96,0.1,0.96),sqM=[0x0a1038,0x141c58,0x3a2c10].map(c=>new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:0.5,roughness:0.5,metalness:0.4}));
for(let s=0;s<NN;s++){const c=s%N,r=Math.floor(s/N),m=new THREE.Mesh(sqG,sqM[s===TH?2:(c+r)&1]);m.position.set(X(s),-0.05,Z(s));scene.add(m);}
const fm=frameBox(9.1,9.1,0xffd24a);
const pG=new THREE.CylinderGeometry(0.3,0.36,0.34,20),kG=new THREE.CylinderGeometry(0.2,0.4,0.75,6),pM={};for(const v of [1,2,3])pM[v]=new THREE.MeshStandardMaterial({color:new THREE.Color(COL[v]).multiplyScalar(0.55),emissive:COL[v],emissiveIntensity:0.08,roughness:0.45});
function sync(m){pcs.forEach(o=>scene.remove(o));pcs=[];for(let s=0;s<NN;s++)if(b[s]){const o=new THREE.Mesh(b[s]===3?kG:pG,pM[b[s]]);o.position.set(X(s),b[s]===3?0.38:0.17,Z(s));o.userData.y=o.position.y;scene.add(o);pcs.push(o);
    if(m&&s===m.t){o.userData.a={fx:X(m.f),fz:Z(m.f),tx:X(s),tz:Z(s),t:0};o.position.x=X(m.f);o.position.z=Z(m.f);}}}
const ringG=new THREE.RingGeometry(0.14,0.22,20),ringM=new THREE.MeshBasicMaterial({color:0x8dff5a,side:THREE.DoubleSide});
const dots=Array.from({length:18},()=>{const m=new THREE.Mesh(ringG,ringM);m.rotation.x=-Math.PI/2;m.visible=false;scene.add(m);return m;});
const cursor=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(0.98,0.3,0.98)),new THREE.LineBasicMaterial({color:0xffffff}));scene.add(cursor);
const humanTurn=()=>state==='play'&&busy<=0&&human(turn);
function marks(){dots.forEach(d=>d.visible=false);if(humanTurn()&&sel>=0)legalMs.filter(m=>m.f===sel).forEach((m,i)=>{if(dots[i]){dots[i].visible=true;dots[i].position.set(X(m.t),0.02,Z(m.t));}});}
const cnt=v=>{let n=0;for(let s=0;s<NN;s++)if(b[s]===v)n++;return n;};
function hud(){setHud([['Attackers',cnt(1)],['Turn',state!=='play'?'–':SNAME[turn]+(mode<2?(human(turn)?' · you':' · cpu'):'')],['Defenders',cnt(2)],['Wins',wins]]);}
const menu=()=>menuHtml(['attack · vs cpu','defend · vs cpu','2 players','level: '+['easy','medium','hard'][level]]);
function showTitle(){state='title';sel=-1;marks();hud();overlay('<h1>TAFL</h1><p>a king under siege · his escape is any square on the edge</p>'+menu()+'<p>every piece moves like a rook · trap a piece between two of yours to take it</p><p>pink attackers win by boxing the king in on two sides (four beside his gold throne) · only the king may stand on the throne</p><p>click / tap a piece, then a green ring · or arrows + space</p>');}
function newGame(m){if(m===3){level=(level+1)%3;showTitle();return;}mode=m;b=setup();turn=1;sel=-1;plies=0;busy=0.3;aiT=0.7;legalMs=movesT(b,turn);sync();state='play';overlay('');hud();marks();tone(440,0.12,'square',0.06,880);}
function finish(w,why){state='over';marks();const youWin=mode<2&&human(w);if(youWin){wins++;saveBest(KEY,wins);}hud();jingle(mode===2||youWin);
  overlay('<h2>'+(w?SNAME[w]+' WIN':'DRAW')+'</h2><p>'+why+'</p>'+menu(),.45);}
function play(m){const before=cnt(1)+cnt(2);b=applyT(b,m);plies++;sync(m);const took=before-cnt(1)-cnt(2);sel=-1;busy=0.4;aiT=0.3;
  tone(took?240:420,0.08,took?'sawtooth':'triangle',0.07);if(took){cam.shake=0.14;emit(X(m.t),0.4,Z(m.t),COL[turn===1?2:1],16,3.5,0.6);}
  const res=resultT(b);turn=3-turn;legalMs=movesT(b,turn);hud();marks();
  const end=res?[res,res===1?'the king is captured':'the king has reached the edge']:!legalMs.length?[3-turn,'no moves left']:plies>=300?[0,'300 moves without a result']:null;
  if(end){busy=9;setTimeout(()=>{if(state==='play')finish(end[0],end[1]);},800);}}
function click(s){if(!humanTurn())return;const m=sel>=0&&legalMs.find(q=>q.f===sel&&q.t===s);if(m){play(m);return;}
  sel=sideOf(b[s])===turn&&legalMs.some(q=>q.f===s)?s:-1;marks();}
onTap=()=>{if(!humanTurn())return;const h=pointerOn(P0);if(!h)return;const c=Math.floor(h.x+4.5),r=Math.floor(h.z+4.5);if(c<0||c>=N||r<0||r>=N)return;keyNav=false;click(r*N+c);};
onKeyDown=k=>{if(k==='escape'){showTitle();return;}
  if(state!=='play'){if(k>='1'&&k<='4')newGame(+k-1);else if(k===' '||k==='enter')newGame(mode);return;}
  const c=cur%N,r=Math.floor(cur/N);keyNav=true;
  if(k==='arrowleft')cur=r*N+Math.max(0,c-1);else if(k==='arrowright')cur=r*N+Math.min(N-1,c+1);else if(k==='arrowup')cur=Math.max(0,r-1)*N+c;else if(k==='arrowdown')cur=Math.min(N-1,r+1)*N+c;
  else if(k===' '||k==='enter')click(cur);};
onMenu(newGame);hbtn('menu',showTitle);
function update(dt,t){gh.material.color.setHSL((t*0.02)%1,0.6,0.5);
  if(busy>0&&busy<5){busy-=dt;if(busy<=0)marks();}
  if(state==='play'&&busy<=0&&!human(turn)){aiT-=dt;if(aiT<=0){const m=aiPick(b,turn,level);if(m)play(m);}}
  for(const o of pcs){const a=o.userData.a;if(!a||a.t>=1)continue;a.t=Math.min(1,a.t+dt*3.4);const e=a.t*a.t*(3-2*a.t);o.position.set(a.fx+(a.tx-a.fx)*e,o.userData.y+Math.sin(a.t*Math.PI)*0.4,a.fz+(a.tz-a.fz)*e);}
  dots.forEach(d=>d.scale.setScalar(1+Math.sin(t*5)*0.15));cursor.visible=keyNav&&state==='play';cursor.position.set(X(cur),0.1,Z(cur));
  if(sel>=0&&humanTurn()){cursor.visible=true;cursor.position.set(X(sel),0.1,Z(sel));}}
sync();showTitle();
run(update);

</script>
