<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>SHARD STORM — Neon Brick Breaker Plus</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#02000a;color:#dff;
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;touch-action:none;user-select:none}
  canvas{display:block;position:fixed;inset:0}
  #hud{position:fixed;left:0;right:0;top:0;display:grid;grid-template-columns:repeat(4,1fr);
    padding:14px 22px;pointer-events:none;letter-spacing:.18em;font-size:13px;text-transform:uppercase}
  #hud div{text-shadow:0 0 8px var(--glow),0 0 22px var(--glow)}
  #hud div:nth-child(2),#hud div:nth-child(3){text-align:center}
  #hud div:nth-child(4){text-align:right}
  #hud b{display:block;font-size:24px;letter-spacing:.08em;color:#fff;font-variant-numeric:tabular-nums}
  #msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;pointer-events:none;padding:16px}
  #msg h1{margin:0;font-size:clamp(44px,10vw,124px);letter-spacing:.18em;padding-left:.18em;color:#fff;
    text-shadow:0 0 12px #fff,0 0 40px var(--glow),0 0 90px var(--glow2);font-weight:800}
  #msg h2{margin:0;font-size:clamp(28px,6vw,64px);letter-spacing:.3em;padding-left:.3em;color:#fff;
    text-shadow:0 0 12px #fff,0 0 40px var(--glow)}
  #msg p{margin:14px 0 0;letter-spacing:.28em;font-size:clamp(11px,1.6vw,15px);text-transform:uppercase;
    color:#cfe;text-shadow:0 0 10px var(--glow)}
  #msg .blink{animation:bl 1.1s infinite;color:#fff;margin-top:34px}
  @keyframes bl{50%{opacity:.25}}
  #pause{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:48px;
    letter-spacing:.4em;color:#fff;background:rgba(2,0,10,.55);text-shadow:0 0 30px var(--glow)}
  #back{position:fixed;left:16px;bottom:14px;color:#9ef;text-decoration:none;font-size:12px;letter-spacing:.2em;
    text-transform:uppercase;opacity:.7;z-index:5}
  #back:hover{opacity:1}
  .pop{position:fixed;font-weight:800;font-size:22px;pointer-events:none;transform:translate(-50%,-50%);
    animation:pop 1s ease-out forwards;text-shadow:0 0 10px currentColor}
  @keyframes pop{to{transform:translate(-50%,-220%) scale(1.5);opacity:0}}
  .tc{position:fixed;bottom:46px;display:none;gap:10px;z-index:4;grid-auto-flow:column}
  .tc.tl{left:14px;grid-template-columns:repeat(3,58px);grid-auto-flow:row}.tc.tr{right:14px}
  .tc button{width:58px;height:58px;border-radius:14px;border:1px solid var(--glow);background:rgba(10,14,44,.55);
    color:#fff;font-size:20px;font-family:inherit;touch-action:none;box-shadow:inset 0 0 16px -8px var(--glow)}
  .tc button:active{background:rgba(60,200,255,.35)}
  @media (pointer:coarse){.tc{display:grid}}
  :root{--glow:#3df;--glow2:#f4d}
</style>
</head>
<body>
<div id="hud">
  <div><span id="l0"></span><b id="v0"></b></div><div><span id="l1"></span><b id="v1"></b></div>
  <div><span id="l2"></span><b id="v2"></b></div><div><span id="l3"></span><b id="v3"></b></div>
</div>
<div id="msg"></div>
<div id="pause">PAUSED</div>
<a id="back" href="index.html">&larr; games</a>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
'use strict';
/* ================= shared engine: renderer, bloom, particles, audio, input ================= */
const $=id=>document.getElementById(id);
const setMsg=h=>{$('msg').innerHTML=h;};
const setHud=a=>a.forEach((p,i)=>{$('l'+i).textContent=p[0];$('v'+i).textContent=p[1];});
if(!window.THREE){setMsg('<h2>OFFLINE</h2><p>three.js could not be loaded — check your internet connection</p>');throw new Error('three.js missing');}
const rnd=n=>Math.floor(Math.random()*n),rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x02000a);
const camera=new THREE.PerspectiveCamera(50,1,0.1,600);
const cam={pos:new THREE.Vector3(0,0,30),look:new THREE.Vector3(),shake:0};
let onResize=null,onKeyDown=null,onTap=null,muted=false,paused=false;

const dotTex=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');
  const g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'#fff');g.addColorStop(0.3,'rgba(255,255,255,.7)');
  g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);})();

const stars=(()=>{const n=2200,p=new Float32Array(n*3),c=new Float32Array(n*3),col=new THREE.Color();
  for(let i=0;i<n;i++){const r=140+Math.random()*140,a=Math.random()*Math.PI*2,e=Math.asin(Math.random()*2-1);
    p[i*3]=Math.cos(a)*Math.cos(e)*r;p[i*3+1]=Math.sin(e)*r;p[i*3+2]=Math.sin(a)*Math.cos(e)*r;
    col.setHSL(0.5+Math.random()*0.35,0.8,0.5+Math.random()*0.4);c[i*3]=col.r;c[i*3+1]=col.g;c[i*3+2]=col.b;}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));
  g.setAttribute('color',new THREE.BufferAttribute(c,3));
  const s=new THREE.Points(g,new THREE.PointsMaterial({size:2.2,map:dotTex,vertexColors:true,transparent:true,
    blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
  scene.add(s);return s;})();

const PN=1400,pPos=new Float32Array(PN*3),pCol=new Float32Array(PN*3),pVel=new Float32Array(PN*3),
  pBase=new Float32Array(PN*3),pLife=new Float32Array(PN),pMax=new Float32Array(PN);
let pNext=0,pGrav=0;
for(let i=0;i<PN;i++)pPos[i*3+1]=-999;
const pGeo=new THREE.BufferGeometry();
pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
pGeo.setAttribute('color',new THREE.BufferAttribute(pCol,3));
const pPoints=new THREE.Points(pGeo,new THREE.PointsMaterial({size:0.5,map:dotTex,vertexColors:true,transparent:true,
  blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
pPoints.frustumCulled=false;scene.add(pPoints);
const tmpC=new THREE.Color();
function emit(x,y,z,color,n,speed,life){
  tmpC.set(color);
  for(let k=0;k<n;k++){
    const i=pNext;pNext=(pNext+1)%PN;
    const a=Math.random()*Math.PI*2,e=Math.asin(Math.random()*2-1),s=speed*(0.25+Math.random()*0.75);
    pPos[i*3]=x;pPos[i*3+1]=y;pPos[i*3+2]=z;
    pVel[i*3]=Math.cos(a)*Math.cos(e)*s;pVel[i*3+1]=Math.sin(e)*s;pVel[i*3+2]=Math.sin(a)*Math.cos(e)*s;
    pBase[i*3]=tmpC.r;pBase[i*3+1]=tmpC.g;pBase[i*3+2]=tmpC.b;
    pLife[i]=pMax[i]=life*(0.5+Math.random()*0.5);
  }
}
function updateParticles(dt){
  const damp=Math.pow(0.1,dt);
  for(let i=0;i<PN;i++){
    if(pLife[i]<=0)continue;
    pLife[i]-=dt;const j=i*3;
    if(pLife[i]<=0){pPos[j+1]=-999;pCol[j]=pCol[j+1]=pCol[j+2]=0;continue;}
    pVel[j+1]-=pGrav*dt;
    pPos[j]+=pVel[j]*dt;pPos[j+1]+=pVel[j+1]*dt;pPos[j+2]+=pVel[j+2]*dt;
    pVel[j]*=damp;pVel[j+1]*=damp;pVel[j+2]*=damp;
    const f=pLife[i]/pMax[i];
    pCol[j]=pBase[j]*f;pCol[j+1]=pBase[j+1]*f;pCol[j+2]=pBase[j+2]*f;
  }
  pGeo.attributes.position.needsUpdate=true;pGeo.attributes.color.needsUpdate=true;
}

let composer=null,bloom=null;
if(THREE.EffectComposer&&THREE.UnrealBloomPass&&THREE.RenderPass){
  try{
    composer=new THREE.EffectComposer(renderer);
    composer.addPass(new THREE.RenderPass(scene,camera));
    bloom=new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.85,0.5,0.32);
    composer.addPass(bloom);
  }catch(e){composer=null;}
}
function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h);if(composer)composer.setSize(w,h);
  camera.aspect=w/h;camera.updateProjectionMatrix();
  if(onResize)onResize(camera.aspect);
}
addEventListener('resize',resize);

let actx=null;
function audioInit(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(actx&&actx.state==='suspended')actx.resume();}
function tone(f,dur,type,vol,slide){
  if(!actx||muted)return;
  const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(vol||0.08,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+dur+0.02);
}

const keys={};
const pointer={nx:0,ny:0,down:false,moved:false};
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
  audioInit();
  if(k==='p'){paused=!paused;$('pause').style.display=paused?'flex':'none';return;}
  if(k==='m'){muted=!muted;return;}
  const first=!keys[k];keys[k]=true;
  if(onKeyDown&&first&&!paused)onKeyDown(k,e);
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
function setPointer(e){pointer.nx=e.clientX/innerWidth*2-1;pointer.ny=-(e.clientY/innerHeight)*2+1;pointer.moved=true;}
addEventListener('pointermove',setPointer);
addEventListener('pointerdown',e=>{
  if(e.target.closest&&e.target.closest('a,button'))return;
  audioInit();setPointer(e);pointer.down=true;if(onTap&&!paused)onTap(e);
});
addEventListener('pointerup',()=>{pointer.down=false;});
addEventListener('pointercancel',()=>{pointer.down=false;});
const _ray=new THREE.Raycaster(),_v2=new THREE.Vector2(),_hit=new THREE.Vector3();
function pointerOn(plane){_v2.set(pointer.nx,pointer.ny);_ray.setFromCamera(_v2,camera);return _ray.ray.intersectPlane(plane,_hit);}

const _pv=new THREE.Vector3();
function popup(text,x,y,z,color){
  _pv.set(x,y,z).project(camera);
  const el=document.createElement('div');el.className='pop';el.textContent=text;el.style.color=color||'#fff';
  el.style.left=((_pv.x+1)/2*innerWidth)+'px';el.style.top=((1-_pv.y)/2*innerHeight)+'px';
  document.body.appendChild(el);setTimeout(()=>el.remove(),1000);
}
function loadBest(key){try{return +localStorage.getItem(key)||0;}catch(e){return 0;}}
function saveBest(key,v){try{localStorage.setItem(key,v);}catch(e){}}
const hex=c=>'#'+c.toString(16).padStart(6,'0');

// on-screen buttons for touch devices; each one drives a key
function touchKeys(left,right){
  const mk=(arr,cls)=>{if(!arr||!arr.length)return;const d=document.createElement('div');d.className='tc '+cls;
    arr.forEach(([k,l,area])=>{const b=document.createElement('button');b.textContent=l;if(area)b.style.gridArea=area;
      const dn=e=>{e.preventDefault();audioInit();if(!keys[k]){keys[k]=true;if(onKeyDown&&!paused)onKeyDown(k,e);}};
      const up=e=>{e.preventDefault();keys[k]=false;};
      b.addEventListener('pointerdown',dn);b.addEventListener('pointerup',up);
      b.addEventListener('pointerleave',up);b.addEventListener('pointercancel',up);d.appendChild(b);});
    document.body.appendChild(d);};
  mk(left,'tl');mk(right,'tr');
}
const DPAD=[['arrowup','▲','1/2'],['arrowleft','◀','2/1'],['arrowdown','▼','2/2'],['arrowright','▶','2/3']];
const LR=[['arrowleft','◀','1/1'],['arrowright','▶','1/3']];
const coarse=matchMedia('(pointer:coarse)').matches;

function run(update){
  let last=performance.now(),t=0;
  function frame(now){
    requestAnimationFrame(frame);
    const dt=Math.min(0.05,(now-last)/1000);last=now;
    if(!paused){t+=dt;update(dt,t);updateParticles(dt);stars.rotation.y=t*0.006;}
    camera.position.copy(cam.pos);
    if(cam.shake>0){cam.shake=Math.max(0,cam.shake-dt);
      camera.position.x+=(Math.random()-0.5)*cam.shake;camera.position.y+=(Math.random()-0.5)*cam.shake;}
    camera.lookAt(cam.look);
    if(composer)composer.render();else renderer.render(scene,camera);
  }
  resize();requestAnimationFrame(frame);
}

/* ================= SHARD STORM — brick breaker with capsules, lasers, armour and drifting wisps ================= */
const KEY='shardstorm_best';let best=loadBest(KEY);
const FW=8,FH=20,PY=1,BW=1.55,BH=0.62,R=0.28;
let state='title',score=0,lives=3,level=1,bannerT=0,laserT=0,slowT=0,catchT=0,stunT=0,fireT=0,wispT=6;

scene.add(new THREE.AmbientLight(0x556699,0.75));
const dl=new THREE.DirectionalLight(0xffffff,0.55);dl.position.set(3,8,10);scene.add(dl);
onResize=a=>{const k=Math.max(1,0.82/a);cam.pos.set(0,4.5,25.5*k);};cam.look.set(0,9.6,0);
const frameMat=new THREE.MeshBasicMaterial({color:0xff4fd8});
function bar(w,h,x,y){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,1),frameMat);m.position.set(x,y,0);scene.add(m);}
bar(0.22,FH+0.5,-FW-0.11,FH/2);bar(0.22,FH+0.5,FW+0.11,FH/2);bar(FW*2+0.44,0.22,0,FH+0.11);
const back=new THREE.Mesh(new THREE.PlaneGeometry(FW*2,FH),new THREE.MeshStandardMaterial({color:0x070716,roughness:0.35,metalness:0.7}));
back.position.set(0,FH/2,-0.8);scene.add(back);
const gh=new THREE.GridHelper(60,60,0x1c2c70,0x0e1640);gh.rotation.x=Math.PI/2;gh.position.set(0,FH/2,-0.9);scene.add(gh);

// layouts: '.' gap, 'o' brick, 'h' two-hit brick, '#' armour (cannot be broken)
const MAPS=[
 ['ooooooooo','ooooooooo','hhhhhhhhh','ooooooooo','ooooooooo'],
 ['o.o.o.o.o','ooooooooo','#.#.#.#.#','ooooooooo','o.o.o.o.o','hhhhhhhhh'],
 ['....h....','...ooo...','..ooooo..','.ooo#ooo.','ooooooooo','.ooo#ooo.','..ooooo..','...ooo...'],
 ['hhhhhhhhh','o.......o','o.ooooo.o','o.o###o.o','o.ooooo.o','o.......o','##.ooo.##'],
 ['#ooooooo#','ohohohoho','ooooooooo','#.#.#.#.#','ooooooooo','hohohohoh','ooooooooo']];
const brickGeo=new THREE.BoxGeometry(BW,BH,0.8);let bricks=[];
function buildLevel(){
  bricks.forEach(b=>{scene.remove(b.mesh);b.mesh.material.dispose();});bricks=[];
  MAPS[(level-1)%MAPS.length].forEach((row,r)=>[...row].forEach((ch,c)=>{
    if(ch==='.')return;const solid=ch==='#',hard=ch==='h';
    const col=solid?new THREE.Color(0x555a78):hard?new THREE.Color(0xcfd8ff):new THREE.Color().setHSL((0.55+r*0.07+level*0.13)%1,1,0.5);
    const mesh=new THREE.Mesh(brickGeo,new THREE.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:solid?0.1:hard?0.25:0.55,roughness:0.3,metalness:solid||hard?0.9:0.2}));
    const x=(c-4)*(BW+0.13),y=18.2-r*(BH+0.14);mesh.position.set(x,y,0);scene.add(mesh);
    bricks.push({x,y,hp:solid?99:hard?2:1,solid,mesh,col:col.getHex()});}));
}
const paddle={x:0,w:3.2,wideT:0,mesh:new THREE.Mesh(new THREE.BoxGeometry(1,0.42,0.9),new THREE.MeshStandardMaterial({color:0xff9be8,emissive:0xff4fd8,emissiveIntensity:1.1}))};
paddle.mesh.position.set(0,PY,0);scene.add(paddle.mesh);
const ballGeo=new THREE.SphereGeometry(R,20,16),ballMat=new THREE.MeshBasicMaterial({color:0xffffff});
let balls=[],caps=[],beams=[],wisps=[];
const ballLight=new THREE.PointLight(0xffd0f0,1.8,13,2);scene.add(ballLight);
const spd=()=>Math.min(21,11+level*1.1)*(slowT>0?0.6:1);
function addBall(x,y,vx,vy,stuck){const m=new THREE.Mesh(ballGeo,ballMat);scene.add(m);const b={x,y,vx,vy,stuck,off:0,mesh:m};balls.push(b);return b;}
const clearList=a=>{a.forEach(o=>scene.remove(o.mesh));a.length=0;};
function resetBall(){clearList(balls);addBall(paddle.x,PY+0.21+R,0,0,true);}
const CAP={L:[0xff5a4f,'LASER'],S:[0x5dff7a,'SLOW'],C:[0x7ff6ff,'CATCH'],M:[0xff4fd8,'MULTI'],W:[0xffd34f,'WIDE'],X:[0xffffff,'+1 LIFE']};
const capGeo=new THREE.CylinderGeometry(0.2,0.2,0.9,10);capGeo.rotateZ(Math.PI/2);
const beamGeo=new THREE.BoxGeometry(0.09,0.7,0.09),beamMat=new THREE.MeshBasicMaterial({color:0xff8a7a}),wispGeo=new THREE.TorusKnotGeometry(0.3,0.09,40,6);
function hud(){if(score>best){best=score;saveBest(KEY,best);}
  setHud([['Score',score],['Level',level],['Lives',lives>0?'◆'.repeat(lives):'–'],['Best',best]]);}
function clearFx(){laserT=slowT=catchT=stunT=0;paddle.wideT=0;clearList(caps);clearList(beams);clearList(wisps);wispT=6;}
function launch(){for(const b of balls)if(b.stuck){b.stuck=false;const a=clamp(b.off/(paddle.w/2),-1,1)*0.9||rand(-0.4,0.4);b.vx=Math.sin(a)*spd();b.vy=Math.cos(a)*spd();tone(440,0.1,'square',0.06,880);}}
function newGame(){score=0;lives=3;level=1;paddle.x=0;clearFx();buildLevel();resetBall();state='play';setMsg('<h2>LEVEL 1</h2><p>space / click to launch</p>');bannerT=2;hud();}
function action(){if(state==='play')launch();else newGame();}
onKeyDown=k=>{if(k===' '||k==='enter')action();};
onTap=()=>action();
touchKeys(LR,[[' ','●']]);
function breakBrick(k,x,y){
  if(k.solid){tone(180,0.05,'square',0.05);emit(x,y,0.5,0x9aa0c0,5,3,0.3);return;}
  k.hp--;cam.shake=Math.max(cam.shake,0.12);
  if(k.hp>0){k.mesh.material.emissiveIntensity=0.9;tone(300,0.08,'square',0.06);emit(x,y,0.5,0xffffff,8,4,0.4);return;}
  scene.remove(k.mesh);k.mesh.material.dispose();k.dead=true;score+=10*level;hud();emit(k.x,k.y,0.3,k.col,26,7,0.8);tone(500+k.y*30,0.09,'triangle',0.08);
  if(Math.random()<0.17){const t='LLSSCCMMWWX'[rnd(11)],m=new THREE.Mesh(capGeo,new THREE.MeshBasicMaterial({color:CAP[t][0]}));scene.add(m);caps.push({x:k.x,y:k.y,t,mesh:m});}
}
function stepBall(b,dt){
  let n=Math.ceil(Math.hypot(b.vx,b.vy)*dt/0.12)||1;const h=dt/n;
  while(n--){
    b.x+=b.vx*h;b.y+=b.vy*h;
    if(b.x<-FW+R){b.x=-FW+R;b.vx=Math.abs(b.vx);tone(220,0.04,'sine',0.04);}
    if(b.x>FW-R){b.x=FW-R;b.vx=-Math.abs(b.vx);tone(220,0.04,'sine',0.04);}
    if(b.y>FH-R){b.y=FH-R;b.vy=-Math.abs(b.vy);tone(220,0.04,'sine',0.04);}
    if(b.vy<0&&b.y-R<PY+0.21&&b.y>PY-0.35&&Math.abs(b.x-paddle.x)<paddle.w/2+R){
      b.y=PY+0.21+R;tone(330,0.07,'square',0.06);emit(b.x,PY+0.3,0.3,0xff9be8,8,3,0.35);
      if(catchT>0){b.stuck=true;b.off=b.x-paddle.x;b.vx=b.vy=0;return;}
      const a=clamp((b.x-paddle.x)/(paddle.w/2),-1,1)*1.05,s=spd();b.vx=Math.sin(a)*s;b.vy=Math.cos(a)*s;
    }
    for(const k of bricks){
      if(k.dead)continue;const dx=b.x-k.x,dy=b.y-k.y,px=BW/2+R-Math.abs(dx),py=BH/2+R-Math.abs(dy);
      if(px<=0||py<=0)continue;
      if(px<py){b.vx=Math.sign(dx)*Math.abs(b.vx);b.x+=Math.sign(dx)*px;}else{b.vy=Math.sign(dy)*Math.abs(b.vy);b.y+=Math.sign(dy)*py;}
      if(Math.abs(b.vy)<2.5)b.vy=(b.vy<0?-1:1)*2.5;
      breakBrick(k,b.x,b.y);break;
    }
    for(const w of wisps)if(!w.dead&&Math.hypot(b.x-w.x,b.y-w.y)<0.6+R){w.dead=true;score+=100;hud();popup('+100',w.x,w.y,0,'#b07cff');emit(w.x,w.y,0,0xb07cff,24,6,0.7);
      tone(700,0.12,'triangle',0.07,1400);const a=rand(-0.6,0.6),s=spd();b.vx=Math.sin(a)*s;b.vy=-Math.sign(b.vy||1)*Math.cos(a)*s;}
  }
}
const plane=new THREE.Plane(new THREE.Vector3(0,0,1),0);
function update(dt,t){
  gh.material.color.setHSL((t*0.02)%1,0.6,0.5);
  if(state==='play'){
    if(bannerT>0){bannerT-=dt;if(bannerT<=0)setMsg('');}
    laserT-=dt;slowT-=dt;catchT-=dt;stunT-=dt;paddle.wideT-=dt;
    if(stunT<=0){const mv=((keys['arrowright']||keys['d'])?1:0)-((keys['arrowleft']||keys['a'])?1:0);
      if(mv)paddle.x+=mv*17*dt;else if(pointer.moved){const h=pointerOn(plane);if(h)paddle.x=h.x;}}
    pointer.moved=false;
    paddle.w+=((paddle.wideT>0?5:3.2)-paddle.w)*Math.min(1,dt*8);paddle.x=clamp(paddle.x,-FW+paddle.w/2,FW-paddle.w/2);
    fireT-=dt;if(laserT>0&&(keys[' ']||pointer.down)&&fireT<=0){fireT=0.28;tone(1100,0.06,'sawtooth',0.04,500);
      for(const s of [-1,1]){const m=new THREE.Mesh(beamGeo,beamMat);scene.add(m);beams.push({x:paddle.x+s*(paddle.w/2-0.2),y:PY+0.6,mesh:m});}}
    for(const b of balls){
      if(b.stuck){b.x=paddle.x+b.off;b.y=PY+0.21+R;}
      else{const s=Math.hypot(b.vx,b.vy),g=spd();if(s>0){b.vx*=g/s;b.vy*=g/s;}stepBall(b,dt);if(Math.random()<0.6)emit(b.x,b.y,0,0xffb0ea,1,0.5,0.35);}
    }
    for(const m of beams){m.y+=26*dt;if(m.y>FH)m.dead=true;
      for(const k of bricks)if(!k.dead&&!m.dead&&Math.abs(m.x-k.x)<BW/2&&Math.abs(m.y-k.y)<BH/2+0.3){m.dead=true;breakBrick(k,m.x,m.y);}
      for(const w of wisps)if(!w.dead&&!m.dead&&Math.hypot(m.x-w.x,m.y-w.y)<0.6){m.dead=true;w.dead=true;score+=100;hud();emit(w.x,w.y,0,0xb07cff,24,6,0.7);}
      if(m.dead)scene.remove(m.mesh);else m.mesh.position.set(m.x,m.y,0);}
    // wisps drift down from the top; they scatter the ball and jam the paddle for a moment if they reach it
    wispT-=dt;if(wispT<=0&&wisps.length<2+Math.min(2,level>>1)){wispT=rand(6,11);const m=new THREE.Mesh(wispGeo,new THREE.MeshStandardMaterial({color:0xb07cff,emissive:0xb07cff,emissiveIntensity:0.8}));
      scene.add(m);wisps.push({x:rand(-FW+1,FW-1),y:FH-0.8,ph:rand(0,6),mesh:m});}
    for(const w of wisps){w.y-=(1.3+level*0.1)*dt;w.x=clamp(w.x+Math.sin(t*1.7+w.ph)*2.4*dt,-FW+0.6,FW-0.6);w.mesh.rotation.x+=dt*2;w.mesh.rotation.y+=dt*3;
      if(w.y<PY+0.5&&Math.abs(w.x-paddle.x)<paddle.w/2+0.4&&!w.dead){w.dead=true;stunT=0.9;cam.shake=0.3;tone(140,0.4,'sawtooth',0.08,60);emit(w.x,w.y,0,0xb07cff,30,6,0.7);}
      else if(w.y<-1)w.dead=true;
      if(w.dead){scene.remove(w.mesh);w.mesh.material.dispose();}else w.mesh.position.set(w.x,w.y,0);}
    bricks=bricks.filter(k=>!k.dead);beams=beams.filter(m=>!m.dead);wisps=wisps.filter(w=>!w.dead);
    balls=balls.filter(b=>{if(b.y<-1.5){scene.remove(b.mesh);return false;}return true;});
    for(const p of caps){
      p.y-=5*dt;p.mesh.rotation.x+=dt*5;
      if(p.y<PY+0.5&&p.y>PY-0.5&&Math.abs(p.x-paddle.x)<paddle.w/2+0.45){
        p.dead=true;score+=50;tone(660,0.25,'sine',0.1,1320);emit(p.x,p.y,0.3,CAP[p.t][0],30,6,0.7);popup(CAP[p.t][1],p.x,p.y+1,0,hex(CAP[p.t][0]));
        if(p.t==='W')paddle.wideT=14;else if(p.t==='L')laserT=12;else if(p.t==='S')slowT=10;else if(p.t==='C')catchT=14;
        else if(p.t==='X')lives=Math.min(5,lives+1);
        else{const s=balls.find(b=>!b.stuck);if(s)for(const a of [-0.45,0.45]){const c=Math.cos(a),n=Math.sin(a);addBall(s.x,s.y,s.vx*c-s.vy*n,s.vx*n+s.vy*c,false);}}
        hud();
      }else if(p.y<-1.5)p.dead=true;
      if(p.dead)scene.remove(p.mesh);
    }
    caps=caps.filter(p=>!p.dead);
    if(!balls.length){
      lives--;cam.shake=0.5;tone(300,0.6,'sawtooth',0.12,60);emit(paddle.x,PY,0,0xff5566,60,8,1);clearFx();hud();
      if(lives<=0){state='over';setMsg('<h2>GAME OVER</h2><p>score '+score+'</p><p class="blink">space / click to play again</p>');}else resetBall();
    }else if(!bricks.some(k=>!k.solid)){
      level++;clearFx();buildLevel();resetBall();hud();setMsg('<h2>LEVEL '+level+'</h2>');bannerT=1.8;
      [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,0.18,'square',0.07),i*110));
    }
  }
  for(const k of bricks)if(k.hp===1&&k.mesh.material.emissiveIntensity>0.55)k.mesh.material.emissiveIntensity-=dt;
  paddle.mesh.position.x=paddle.x;paddle.mesh.scale.x=paddle.w;
  paddle.mesh.material.emissive.setHex(stunT>0?0x444444:laserT>0?0xff5a4f:catchT>0?0x22ccff:0xff4fd8);
  for(const b of balls)b.mesh.position.set(b.x,b.y,0);
  if(balls[0])ballLight.position.set(balls[0].x,balls[0].y,1.2);
  for(const p of caps)p.mesh.position.set(p.x,p.y,0);
  cam.look.x=paddle.x*0.06;cam.pos.x=paddle.x*0.25;
}
buildLevel();resetBall();hud();
setMsg('<h1>SHARD STORM</h1><p>break the wall, ride the capsules</p><p style="margin-top:30px">mouse / touch or arrows to move · space / click to launch and fire · P pause · M mute</p><p>capsules: red laser · green slow · cyan catch · pink multi · gold wide · white life — grey armour never breaks</p><p class="blink">press space / click to start</p>');
run(update);

</script>
