<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>LUMEN — Neon Maze Chase</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#02000a;color:#dff;
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;touch-action:none;user-select:none}
  canvas{display:block}
  #hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;
    padding:14px 22px;pointer-events:none;letter-spacing:.18em;font-size:13px;text-transform:uppercase}
  #hud div{text-shadow:0 0 8px #3df,0 0 22px #08f}
  #hud b{display:block;font-size:24px;letter-spacing:.08em;color:#fff;font-variant-numeric:tabular-nums}
  #lives b{color:#7ff;letter-spacing:.3em}
  #msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;pointer-events:none;padding:16px}
  #msg h1{margin:0;font-size:clamp(54px,13vw,150px);letter-spacing:.22em;padding-left:.22em;color:#fff;
    text-shadow:0 0 12px #6ff,0 0 40px #0cf,0 0 90px #70f;font-weight:800}
  #msg h2{margin:0;font-size:clamp(28px,6vw,64px);letter-spacing:.3em;padding-left:.3em;color:#fff;
    text-shadow:0 0 12px #6ff,0 0 40px #0cf}
  #msg p{margin:14px 0 0;letter-spacing:.3em;font-size:clamp(11px,1.6vw,15px);text-transform:uppercase;
    color:#9ef;text-shadow:0 0 10px #08f}
  #msg .blink{animation:bl 1.1s infinite}
  @keyframes bl{50%{opacity:.25}}
  .pop{position:fixed;font-weight:800;font-size:22px;pointer-events:none;transform:translate(-50%,-50%);
    animation:pop 1s ease-out forwards;text-shadow:0 0 10px currentColor}
  @keyframes pop{to{transform:translate(-50%,-220%) scale(1.5);opacity:0}}
</style>
</head>
<body>
<div id="hud">
  <div>Score<b id="score">0</b></div>
  <div style="text-align:center">Level<b id="level">1</b></div>
  <div style="text-align:center" id="lives">Lives<b id="livesv"></b></div>
  <div style="text-align:right">Best<b id="best">0</b></div>
</div>
<div id="msg"></div>
<a href="index.html" style="position:fixed;left:16px;bottom:14px;color:#9ef;text-decoration:none;font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:.7">&larr; games</a>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const msgEl=$('msg');
const setMsg=h=>{msgEl.innerHTML=h;};
if(!window.THREE){setMsg('<h2>OFFLINE</h2><p>three.js could not be loaded — check your internet connection</p>');return;}

/* ---------- constants ---------- */
const W=21,H=21,CX=10,CY=10;
const HOME={x:10,y:9},START={x:10,y:17},TUNNEL_Y=11;
const DIRS=[{x:0,y:-1},{x:-1,y:0},{x:0,y:1},{x:1,y:0}];
const CORNERS=[{x:19,y:1},{x:1,y:1},{x:19,y:19},{x:1,y:19}];
const DRONE_COLORS=[0xff3b30,0xff5fd2,0x5dff7a,0xa56bff];
const wrapX=x=>(x+W)%W;
const rnd=n=>Math.floor(Math.random()*n);

/* ---------- state ---------- */
let grid,distMap,sparkIdx,sparkMesh,cores=[],remaining=0;
let state='title',stateT=0,paused=false,time=0;
let score=0,best=0,lives=3,level=1,frightT=0,combo=0,modeT=0,shake=0,muted=false;
try{best=+localStorage.getItem('lumen_best')||0;}catch(e){}

const open=(x,y)=>y>=0&&y<H&&grid[y][wrapX(x)]===0;

/* ---------- maze generation (random, mirrored, no dead ends) ---------- */
function genMaze(){
  const g=[];for(let y=0;y<H;y++)g.push(new Array(W).fill(1));
  const st=[[1,1]];g[1][1]=0;
  while(st.length){
    const [x,y]=st[st.length-1];
    const o=DIRS.filter(d=>{const nx=x+2*d.x,ny=y+2*d.y;return nx>=1&&nx<=9&&ny>=1&&ny<=19&&g[ny][nx]===1;});
    if(!o.length){st.pop();continue;}
    const d=o[rnd(o.length)];
    g[y+d.y][x+d.x]=0;g[y+2*d.y][x+2*d.x]=0;st.push([x+2*d.x,y+2*d.y]);
  }
  for(let y=0;y<H;y++)for(let x=0;x<10;x++)g[y][20-x]=g[y][x];
  for(let y=1;y<H;y+=2)if(y===HOME.y||y===START.y||Math.random()<0.3)g[y][10]=0;
  const knock=(x,y,force)=>{
    const c=DIRS.filter(d=>{const nx=x+2*d.x,ny=y+2*d.y;return g[y+d.y][x+d.x]===1&&nx>=1&&nx<=11&&ny>=1&&ny<=19;});
    if(!c.length)return;
    const d=c[rnd(c.length)];
    g[y+d.y][x+d.x]=0;g[y+d.y][20-(x+d.x)]=0;
  };
  for(let y=1;y<H;y+=2)for(let x=1;x<=9;x+=2){
    if(DIRS.filter(d=>g[y+d.y][x+d.x]===0).length===1)knock(x,y);
  }
  for(let i=0;i<9;i++)knock(1+2*rnd(5),1+2*rnd(10));
  g[TUNNEL_Y][0]=0;g[TUNNEL_Y][20]=0;
  return g;
}
function bfs(sx,sy){
  const m=[];for(let y=0;y<H;y++)m.push(new Array(W).fill(9999));
  m[sy][sx]=0;const q=[[sx,sy]];
  for(let i=0;i<q.length;i++){
    const [x,y]=q[i];
    for(const d of DIRS){const nx=wrapX(x+d.x),ny=y+d.y;
      if(open(nx,ny)&&m[ny][nx]>m[y][x]+1){m[ny][nx]=m[y][x]+1;q.push([nx,ny]);}}
  }
  return m;
}

/* ---------- three.js setup ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x02000a);
scene.fog=new THREE.FogExp2(0x02000a,0.007);
const camera=new THREE.PerspectiveCamera(50,1,0.1,400);
let camK=1;

scene.add(new THREE.AmbientLight(0x4455aa,0.55));
const sun=new THREE.DirectionalLight(0x8899ff,0.5);sun.position.set(-6,14,8);scene.add(sun);

// floor
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),
  new THREE.MeshStandardMaterial({color:0x070714,roughness:0.45,metalness:0.55}));
floor.rotation.x=-Math.PI/2;scene.add(floor);
const gridH=new THREE.GridHelper(200,200,0x1a2a66,0x0d1338);
gridH.position.set(0.5,0.01,0.5);gridH.material.transparent=true;gridH.material.opacity=0.55;scene.add(gridH);

// soft round sprite texture
const dotTex=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');
  const g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'#fff');g.addColorStop(0.3,'rgba(255,255,255,.7)');
  g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);})();

// stars
(()=>{const n=1800,p=new Float32Array(n*3),c=new Float32Array(n*3),col=new THREE.Color();
  for(let i=0;i<n;i++){const r=90+Math.random()*90,a=Math.random()*Math.PI*2,e=Math.random()*1.2-0.15;
    p[i*3]=Math.cos(a)*Math.cos(e)*r;p[i*3+1]=Math.sin(e)*r;p[i*3+2]=Math.sin(a)*Math.cos(e)*r;
    col.setHSL(0.5+Math.random()*0.35,0.8,0.5+Math.random()*0.4);c[i*3]=col.r;c[i*3+1]=col.g;c[i*3+2]=col.b;}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));
  g.setAttribute('color',new THREE.BufferAttribute(c,3));
  const s=new THREE.Points(g,new THREE.PointsMaterial({size:1.6,map:dotTex,vertexColors:true,transparent:true,
    blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
  s.name='stars';scene.add(s);})();
const stars=scene.getObjectByName('stars');

// particles
const PN=900,pPos=new Float32Array(PN*3),pCol=new Float32Array(PN*3),pVel=new Float32Array(PN*3),
  pBase=new Float32Array(PN*3),pLife=new Float32Array(PN),pMax=new Float32Array(PN);
let pNext=0;
for(let i=0;i<PN;i++)pPos[i*3+1]=-100;
const pGeo=new THREE.BufferGeometry();
pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
pGeo.setAttribute('color',new THREE.BufferAttribute(pCol,3));
const pPoints=new THREE.Points(pGeo,new THREE.PointsMaterial({size:0.42,map:dotTex,vertexColors:true,transparent:true,
  blending:THREE.AdditiveBlending,depthWrite:false}));
pPoints.frustumCulled=false;scene.add(pPoints);
const tmpC=new THREE.Color();
function emit(x,y,z,color,n,speed,life){
  tmpC.set(color);
  for(let k=0;k<n;k++){
    const i=pNext;pNext=(pNext+1)%PN;
    const a=Math.random()*Math.PI*2,e=Math.random()*Math.PI-Math.PI/2,s=speed*(0.3+Math.random()*0.7);
    pPos[i*3]=x;pPos[i*3+1]=y;pPos[i*3+2]=z;
    pVel[i*3]=Math.cos(a)*Math.cos(e)*s;pVel[i*3+1]=Math.abs(Math.sin(e))*s;pVel[i*3+2]=Math.sin(a)*Math.cos(e)*s;
    pBase[i*3]=tmpC.r;pBase[i*3+1]=tmpC.g;pBase[i*3+2]=tmpC.b;
    pLife[i]=pMax[i]=life*(0.5+Math.random()*0.5);
  }
}
function updateParticles(dt){
  const damp=Math.pow(0.08,dt);
  for(let i=0;i<PN;i++){
    if(pLife[i]<=0)continue;
    pLife[i]-=dt;
    const j=i*3;
    if(pLife[i]<=0){pPos[j+1]=-100;pCol[j]=pCol[j+1]=pCol[j+2]=0;continue;}
    pPos[j]+=pVel[j]*dt;pPos[j+1]+=pVel[j+1]*dt;pPos[j+2]+=pVel[j+2]*dt;
    pVel[j]*=damp;pVel[j+1]*=damp;pVel[j+2]*=damp;
    const f=pLife[i]/pMax[i];
    pCol[j]=pBase[j]*f;pCol[j+1]=pBase[j+1]*f;pCol[j+2]=pBase[j+2]*f;
  }
  pGeo.attributes.position.needsUpdate=true;pGeo.attributes.color.needsUpdate=true;
}

// post-processing (bloom) with graceful fallback
let composer=null,bloom=null;
if(THREE.EffectComposer&&THREE.UnrealBloomPass&&THREE.RenderPass){
  try{
    composer=new THREE.EffectComposer(renderer);
    composer.addPass(new THREE.RenderPass(scene,camera));
    bloom=new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.15,0.55,0.18);
    composer.addPass(bloom);
  }catch(e){composer=null;}
}
function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h);if(composer)composer.setSize(w,h);
  camera.aspect=w/h;camera.updateProjectionMatrix();
  camK=Math.max(1,1.35/camera.aspect);
}
addEventListener('resize',resize);resize();

/* ---------- level meshes ---------- */
let levelGroup=null,stripMat=null,stripColor=new THREE.Color();
const dummy=new THREE.Object3D();
function buildLevel(){
  if(levelGroup){scene.remove(levelGroup);
    levelGroup.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose();});}
  levelGroup=new THREE.Group();scene.add(levelGroup);
  grid=genMaze();distMap=bfs(HOME.x,HOME.y);
  const hue=(0.60+(level-1)*0.14)%1;

  // walls
  const walls=[],strips=[];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(grid[y][x]!==1)continue;
    walls.push([x,y]);
    DIRS.forEach((d,i)=>{const nx=x+d.x,ny=y+d.y;
      if(nx>=0&&nx<W&&ny>=0&&ny<H&&grid[ny][nx]===0)strips.push([x,y,d,i]);});
  }
  const WH=0.62;
  const wm=new THREE.InstancedMesh(new THREE.BoxGeometry(1,WH,1),
    new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(hue,0.75,0.11),roughness:0.3,metalness:0.7,
      emissive:new THREE.Color().setHSL(hue,1,0.07)}),walls.length);
  walls.forEach(([x,y],i)=>{dummy.position.set(x-CX,WH/2,y-CY);dummy.rotation.set(0,0,0);dummy.scale.set(1,1,1);
    dummy.updateMatrix();wm.setMatrixAt(i,dummy.matrix);});
  levelGroup.add(wm);
  stripColor.setHSL(hue,1,0.58);
  stripMat=new THREE.MeshBasicMaterial({color:stripColor.clone()});
  const sm=new THREE.InstancedMesh(new THREE.BoxGeometry(1.05,0.05,0.05),stripMat,strips.length*2);
  strips.forEach(([x,y,d],i)=>{
    for(let k=0;k<2;k++){
      dummy.position.set(x-CX+d.x*0.5,k?0.03:WH,y-CY+d.y*0.5);
      dummy.rotation.set(0,d.x?Math.PI/2:0,0);dummy.updateMatrix();sm.setMatrixAt(i*2+k,dummy.matrix);
    }
  });
  levelGroup.add(sm);

  // sparks + cores
  sparkIdx=[];const pts=[];cores=[];remaining=0;
  for(let y=0;y<H;y++){sparkIdx.push(new Array(W).fill(-1));
    for(let x=0;x<W;x++){
      if(grid[y][x]!==0)continue;
      if((x===HOME.x&&y===HOME.y)||(x===START.x&&y===START.y)||(y===TUNNEL_Y&&(x===0||x===W-1)))continue;
      if(CORNERS.some(c=>c.x===x&&c.y===y))continue;
      sparkIdx[y][x]=pts.length;pts.push([x,y]);
    }}
  sparkMesh=new THREE.InstancedMesh(new THREE.OctahedronGeometry(0.11),
    new THREE.MeshBasicMaterial({color:0xffc56b}),pts.length);
  dummy.rotation.set(0,0,0);
  pts.forEach(([x,y],i)=>{dummy.position.set(x-CX,0.32,y-CY);dummy.updateMatrix();sparkMesh.setMatrixAt(i,dummy.matrix);});
  levelGroup.add(sparkMesh);
  remaining=pts.length;
  for(const c of CORNERS){
    const m=new THREE.Mesh(new THREE.IcosahedronGeometry(0.27,0),
      new THREE.MeshStandardMaterial({color:0xff4fd8,emissive:0xff2bd0,emissiveIntensity:1.4,roughness:0.2,flatShading:true}));
    m.position.set(c.x-CX,0.42,c.y-CY);
    const halo=new THREE.Mesh(new THREE.TorusGeometry(0.4,0.025,8,32),new THREE.MeshBasicMaterial({color:0xff7be6}));
    halo.rotation.x=Math.PI/2;m.add(halo);
    levelGroup.add(m);cores.push({x:c.x,y:c.y,mesh:m,alive:true});remaining++;
  }
}

/* ---------- actors ---------- */
function makeActor(){return {fx:0,fy:0,dx:0,dy:0,p:0,moving:false,x:0,y:0};}
const player=makeActor();player.wx=0;player.wy=0;
player.mesh=new THREE.Group();
(()=>{
  const core=new THREE.Mesh(new THREE.SphereGeometry(0.3,32,24),
    new THREE.MeshStandardMaterial({color:0xbffaff,emissive:0x35d9ff,emissiveIntensity:1.3,roughness:0.15}));
  const r1=new THREE.Mesh(new THREE.TorusGeometry(0.43,0.03,8,48),new THREE.MeshBasicMaterial({color:0x7ff6ff}));
  const r2=new THREE.Mesh(new THREE.TorusGeometry(0.5,0.022,8,48),new THREE.MeshBasicMaterial({color:0xffffff}));
  player.r1=r1;player.r2=r2;
  const l=new THREE.PointLight(0x55e8ff,1.8,8,2);l.position.y=0.5;player.light=l;
  player.mesh.add(core,r1,r2,l);scene.add(player.mesh);
})();

const drones=DRONE_COLORS.map((col,i)=>{
  const d=makeActor();d.id=i;d.color=col;d.dead=false;d.scared=false;d.wait=0;
  d.mesh=new THREE.Group();
  d.bodyMat=new THREE.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:0.9,roughness:0.25,metalness:0.3,flatShading:true});
  d.body=new THREE.Mesh(new THREE.OctahedronGeometry(0.36,0),d.bodyMat);
  d.ringMat=new THREE.MeshBasicMaterial({color:col});
  d.ring=new THREE.Mesh(new THREE.TorusGeometry(0.46,0.03,8,6),d.ringMat);
  d.eye=new THREE.Mesh(new THREE.SphereGeometry(0.1,12,10),new THREE.MeshBasicMaterial({color:0xffffff}));
  d.eye.position.set(0,0.05,0.3);
  d.light=new THREE.PointLight(col,1.1,5.5,2);d.light.position.y=0.4;
  d.mesh.add(d.body,d.ring,d.eye,d.light);scene.add(d.mesh);
  return d;
});

function place(e,x,y){e.fx=x;e.fy=y;e.dx=0;e.dy=0;e.p=0;e.moving=false;e.x=x;e.y=y;}
function resetActors(){
  place(player,START.x,START.y);player.wx=player.wy=0;player.mesh.scale.setScalar(1);
  drones.forEach((d,i)=>{place(d,HOME.x,HOME.y);d.dead=false;d.scared=false;d.wait=i*2.5;});
  frightT=0;combo=0;modeT=0;
}
function reverse(e){
  if(!e.moving)return;
  e.fx=wrapX(e.fx+e.dx);e.fy+=e.dy;e.dx=-e.dx;e.dy=-e.dy;e.p=1-e.p;
}
function step(e,dist,choose,arrive){
  let guard=0;
  while(dist>1e-6&&guard++<10){
    if(!e.moving){choose(e);if(!e.moving)break;}
    const s=Math.min(1-e.p,dist);e.p+=s;dist-=s;
    if(e.p>=1-1e-6){e.fx=wrapX(e.fx+e.dx);e.fy+=e.dy;e.p=0;e.moving=false;arrive(e);}
  }
  e.x=e.fx+e.dx*e.p;e.y=e.fy+e.dy*e.p;
}
function playerChoose(e){
  if((e.wx||e.wy)&&open(e.fx+e.wx,e.fy+e.wy)){e.dx=e.wx;e.dy=e.wy;e.moving=true;}
  else if((e.dx||e.dy)&&open(e.fx+e.dx,e.fy+e.dy))e.moving=true;
}
function playerArrive(e){
  const i=sparkIdx[e.fy][e.fx];
  if(i>=0){
    sparkIdx[e.fy][e.fx]=-1;
    dummy.position.set(0,-50,0);dummy.scale.set(0,0,0);dummy.updateMatrix();dummy.scale.set(1,1,1);
    sparkMesh.setMatrixAt(i,dummy.matrix);sparkMesh.instanceMatrix.needsUpdate=true;
    addScore(10);remaining--;blip();
    emit(e.fx-CX,0.35,e.fy-CY,0xffc56b,4,2.5,0.4);
  }
  const c=cores.find(c=>c.alive&&c.x===e.fx&&c.y===e.fy);
  if(c){
    c.alive=false;c.mesh.visible=false;remaining--;addScore(50);
    frightT=Math.max(3,8.5-level*0.6);combo=0;shake=0.25;
    drones.forEach(d=>{if(!d.dead){d.scared=true;reverse(d);}});
    emit(c.x-CX,0.5,c.y-CY,0xff5fe0,60,7,0.9);
    tone(180,0.5,'sawtooth',0.12,900);
  }
  if(remaining<=0&&state==='play'){
    state='clear';stateT=2.4;setMsg('<h2>LEVEL CLEAR</h2>');
    [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,0.18,'square',0.08),i*120));
  }
}
function targetFor(d){
  const scatter=(modeT%26)<6;
  if(scatter)return CORNERS[d.id];
  const px=player.fx,py=player.fy;
  if(d.id===0)return {x:px,y:py};
  if(d.id===1)return {x:px+player.dx*4,y:py+player.dy*4};
  if(d.id===2)return {x:2*px-drones[0].fx,y:2*py-drones[0].fy};
  const dd=(px-d.fx)**2+(py-d.fy)**2;
  return dd>49?{x:px,y:py}:CORNERS[3];
}
function droneChoose(d){
  let o=DIRS.filter(k=>open(d.fx+k.x,d.fy+k.y));
  if(!o.length)return;
  let pick=o[0];
  if(d.dead){
    let bestD=1e9;
    for(const k of o){const v=distMap[d.fy+k.y][wrapX(d.fx+k.x)];if(v<bestD){bestD=v;pick=k;}}
  }else{
    const nr=o.filter(k=>!(k.x===-d.dx&&k.y===-d.dy));if(nr.length)o=nr;
    if(d.scared)pick=o[rnd(o.length)];
    else{
      const t=targetFor(d);let bestD=1e9;
      for(const k of o){const v=(d.fx+k.x-t.x)**2+(d.fy+k.y-t.y)**2+Math.random()*1.5;if(v<bestD){bestD=v;pick=k;}}
    }
  }
  d.dx=pick.x;d.dy=pick.y;d.moving=true;
}
function droneArrive(d){
  if(d.dead&&d.fx===HOME.x&&d.fy===HOME.y){d.dead=false;d.scared=false;d.wait=1;d.dx=d.dy=0;}
}

/* ---------- audio ---------- */
let actx=null,blipFlip=false;
function audioInit(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(actx&&actx.state==='suspended')actx.resume();}
function tone(f,dur,type,vol,slide){
  if(!actx||muted)return;
  const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(vol||0.08,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+dur+0.02);
}
function blip(){blipFlip=!blipFlip;tone(blipFlip?620:780,0.07,'triangle',0.07);}

/* ---------- HUD ---------- */
function addScore(n){score+=n;if(score>best){best=score;try{localStorage.setItem('lumen_best',best);}catch(e){}}hud();}
function hud(){$('score').textContent=score;$('best').textContent=best;$('level').textContent=level;
  $('livesv').textContent=lives>0?'◆'.repeat(lives):'–';}
const v3=new THREE.Vector3();
function popup(text,x,z,color){
  v3.set(x,0.8,z).project(camera);
  const el=document.createElement('div');el.className='pop';el.textContent=text;el.style.color=color;
  el.style.left=((v3.x+1)/2*innerWidth)+'px';el.style.top=((1-v3.y)/2*innerHeight)+'px';
  document.body.appendChild(el);setTimeout(()=>el.remove(),1000);
}
function titleScreen(){
  state='title';
  setMsg('<h1>LUMEN</h1><p>neon maze chase</p><p style="margin-top:34px">arrows / WASD or swipe to move &nbsp;·&nbsp; P pause &nbsp;·&nbsp; M mute</p>'+
    '<p>collect every spark · grab a pink core to hunt the drones</p><p class="blink" style="margin-top:34px;color:#fff">press space / tap to start</p>');
}

/* ---------- game flow ---------- */
function newGame(){score=0;lives=3;level=1;startLevel();}
function startLevel(){
  buildLevel();resetActors();hud();
  state='ready';stateT=2;setMsg('<h2>LEVEL '+level+'</h2><p>ready</p>');
}
function playUpdate(dt){
  modeT+=dt;
  if(frightT>0){frightT-=dt;if(frightT<=0)drones.forEach(d=>d.scared=false);}
  // player
  if(player.moving&&(player.wx||player.wy)&&player.wx===-player.dx&&player.wy===-player.dy)reverse(player);
  step(player,Math.min(6.6,5.6+0.12*level)*dt,playerChoose,playerArrive);
  if(player.moving&&Math.random()<0.7)
    emit(player.x-CX+(Math.random()-0.5)*0.2,0.3+Math.random()*0.3,player.y-CY+(Math.random()-0.5)*0.2,0x49e6ff,1,0.6,0.5);
  // drones
  const ds=Math.min(6.1,4.3+0.28*(level-1));
  for(const d of drones){
    if(d.wait>0){d.wait-=dt;continue;}
    step(d,(d.dead?11:d.scared?2.9:ds)*dt,droneChoose,droneArrive);
  }
  if(state!=='play')return;
  // collisions
  for(const d of drones){
    if(d.dead)continue;
    if(Math.abs(d.x-player.x)+Math.abs(d.y-player.y)>0.6)continue;
    if(d.scared){
      d.dead=true;d.scared=false;combo++;
      const pts=200*Math.pow(2,combo-1);addScore(pts);
      popup(pts,d.x-CX,d.y-CY,'#'+d.color.toString(16).padStart(6,'0'));
      emit(d.x-CX,0.5,d.y-CY,d.color,70,8,1);shake=0.3;
      tone(300,0.3,'square',0.1,1400);
    }else{
      state='dying';stateT=1.6;shake=0.6;
      emit(player.x-CX,0.5,player.y-CY,0x7ff6ff,160,9,1.4);
      emit(player.x-CX,0.5,player.y-CY,0xffffff,60,5,1.2);
      tone(600,1.1,'sawtooth',0.14,50);
      return;
    }
  }
}
function update(dt){
  time+=dt;
  if(!paused){
    if(state==='ready'){stateT-=dt;if(stateT<=0){state='play';setMsg('');}}
    else if(state==='play')playUpdate(dt);
    else if(state==='dying'){
      stateT-=dt;player.mesh.scale.setScalar(Math.max(0.001,(stateT-0.8)/0.8));
      if(stateT<=0){
        lives--;hud();
        if(lives<=0){state='over';setMsg('<h2>GAME OVER</h2><p>score '+score+'</p><p class="blink" style="margin-top:30px;color:#fff">press space / tap to play again</p>');}
        else{resetActors();state='ready';stateT=1.6;setMsg('<h2>READY</h2>');}
      }
    }else if(state==='clear'){
      stateT-=dt;
      if(stripMat)stripMat.color.set(Math.floor(stateT*6)%2?0xffffff:stripColor.getHex());
      if(stateT<=0){level++;startLevel();}
    }
    updateParticles(dt);
  }
  visuals(dt);
}

/* ---------- visuals ---------- */
const blue=new THREE.Color(0x2d5bff),white=new THREE.Color(0xffffff),camT=new THREE.Vector3();
function visuals(dt){
  const t=time;
  // player
  const px=player.x-CX,pz=player.y-CY;
  player.mesh.position.set(px,0.45+Math.sin(t*5)*0.05,pz);
  player.r1.rotation.set(t*2.3,t*1.7,0);player.r2.rotation.set(-t*1.5,0,t*2.1);
  player.mesh.visible=state!=='over'&&state!=='title';
  player.light.intensity=1.6+Math.sin(t*8)*0.25+(frightT>0?1.2:0);
  // drones
  for(const d of drones){
    d.mesh.visible=state!=='title';
    d.mesh.position.set(d.x-CX,0.5+Math.sin(t*3+d.id*1.7)*0.08,d.y-CY);
    if(d.dx||d.dy)d.mesh.rotation.y=Math.atan2(d.dx,d.dy);
    d.body.rotation.y=t*2+d.id;d.ring.rotation.set(Math.PI/2+Math.sin(t*2+d.id)*0.4,0,t*3);
    d.body.visible=d.ring.visible=!d.dead;
    d.eye.scale.setScalar(d.dead?1.8:1);
    let c;
    if(d.scared){c=(frightT<2&&Math.floor(t*8)%2)?white:blue;d.mesh.scale.setScalar(0.8+Math.sin(t*20)*0.04);}
    else{c=tmpC.set(d.color);d.mesh.scale.setScalar(1);}
    d.bodyMat.color.copy(c);d.bodyMat.emissive.copy(c);d.ringMat.color.copy(c);d.light.color.copy(c);
    d.light.intensity=d.dead?0.25:1.1;
  }
  // cores & sparks
  for(const c of cores){c.mesh.rotation.y=t*1.5;c.mesh.rotation.x=t;c.mesh.scale.setScalar(1+Math.sin(t*6)*0.18);}
  stars.rotation.y=t*0.008;
  if(bloom)bloom.strength=1.1+(frightT>0?0.35:0)+Math.sin(t*2)*0.05;
  // camera
  let tx=0,tz=0;
  if(state==='title'||state==='over'){
    const a=t*0.15;camT.set(Math.sin(a)*19*camK,14*camK,Math.cos(a)*19*camK);
  }else{
    tx=px*0.18;tz=pz*0.12;camT.set(px*0.3,18.5*camK,13*camK+pz*0.15);
  }
  camera.position.lerp(camT,1-Math.pow(0.004,dt));
  if(shake>0){shake=Math.max(0,shake-dt);
    camera.position.x+=(Math.random()-0.5)*shake*0.8;camera.position.y+=(Math.random()-0.5)*shake*0.8;}
  camera.lookAt(tx,0,tz+0.8);
}

/* ---------- input ---------- */
function setDir(x,y){player.wx=x;player.wy=y;}
function startKey(){audioInit();if(state==='title'||state==='over')newGame();}
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
  audioInit();
  if(k==='arrowup'||k==='w')setDir(0,-1);
  else if(k==='arrowdown'||k==='s')setDir(0,1);
  else if(k==='arrowleft'||k==='a')setDir(-1,0);
  else if(k==='arrowright'||k==='d')setDir(1,0);
  else if(k===' '||k==='enter')startKey();
  else if(k==='p'&&(state==='play'||state==='ready')){paused=!paused;setMsg(paused?'<h2>PAUSED</h2>':(state==='ready'?'<h2>READY</h2>':''));}
  else if(k==='m')muted=!muted;
});
let ts=null;
addEventListener('touchstart',e=>{const t=e.touches[0];ts={x:t.clientX,y:t.clientY};audioInit();},{passive:true});
addEventListener('touchmove',e=>{
  if(!ts)return;const t=e.touches[0],dx=t.clientX-ts.x,dy=t.clientY-ts.y;
  if(Math.abs(dx)+Math.abs(dy)<24)return;
  if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?1:-1,0);else setDir(0,dy>0?1:-1);
  ts={x:t.clientX,y:t.clientY,moved:true};
},{passive:true});
addEventListener('touchend',()=>{if(ts&&!ts.moved)startKey();ts=null;});
addEventListener('mousedown',e=>{if(!(e.target.closest&&e.target.closest('a')))startKey();});

/* ---------- boot ---------- */
buildLevel();resetActors();hud();titleScreen();
camera.position.set(0,16,20);
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  update(dt);
  if(composer)composer.render();else renderer.render(scene,camera);
}
requestAnimationFrame(frame);
})();
</script>
</body>
