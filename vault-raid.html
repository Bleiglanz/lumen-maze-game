<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>VAULT RAID — Neon Chopper Rescue</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#02000a;color:#dff;
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;touch-action:none;user-select:none}
  canvas{display:block;position:fixed;inset:0}
  #hud{position:fixed;left:0;right:0;top:0;display:grid;grid-template-columns:repeat(4,1fr);
    padding:14px 22px;pointer-events:none;letter-spacing:.18em;font-size:13px;text-transform:uppercase}
  #hud div{text-shadow:0 0 8px var(--glow),0 0 22px var(--glow)}
  #hud div:nth-child(2),#hud div:nth-child(3){text-align:center}
  #hud div:nth-child(4){text-align:right}
  #hud b{display:block;font-size:24px;letter-spacing:.08em;color:#fff;font-variant-numeric:tabular-nums}
  #msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;pointer-events:none;padding:16px}
  #msg h1{margin:0;font-size:clamp(44px,10vw,124px);letter-spacing:.18em;padding-left:.18em;color:#fff;
    text-shadow:0 0 12px #fff,0 0 40px var(--glow),0 0 90px var(--glow2);font-weight:800}
  #msg h2{margin:0;font-size:clamp(28px,6vw,64px);letter-spacing:.3em;padding-left:.3em;color:#fff;
    text-shadow:0 0 12px #fff,0 0 40px var(--glow)}
  #msg p{margin:14px 0 0;letter-spacing:.28em;font-size:clamp(11px,1.6vw,15px);text-transform:uppercase;
    color:#cfe;text-shadow:0 0 10px var(--glow)}
  #msg .blink{animation:bl 1.1s infinite;color:#fff;margin-top:34px}
  @keyframes bl{50%{opacity:.25}}
  #pause{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:48px;
    letter-spacing:.4em;color:#fff;background:rgba(2,0,10,.55);text-shadow:0 0 30px var(--glow)}
  #back{position:fixed;left:16px;bottom:14px;color:#9ef;text-decoration:none;font-size:12px;letter-spacing:.2em;
    text-transform:uppercase;opacity:.7;z-index:5}
  #back:hover{opacity:1}
  .pop{position:fixed;font-weight:800;font-size:22px;pointer-events:none;transform:translate(-50%,-50%);
    animation:pop 1s ease-out forwards;text-shadow:0 0 10px currentColor}
  @keyframes pop{to{transform:translate(-50%,-220%) scale(1.5);opacity:0}}
  .tc{position:fixed;bottom:46px;display:none;gap:10px;z-index:4;grid-auto-flow:column}
  .tc.tl{left:14px;grid-template-columns:repeat(3,58px);grid-auto-flow:row}.tc.tr{right:14px}
  .tc button{width:58px;height:58px;border-radius:14px;border:1px solid var(--glow);background:rgba(10,14,44,.55);
    color:#fff;font-size:20px;font-family:inherit;touch-action:none;box-shadow:inset 0 0 16px -8px var(--glow)}
  .tc button:active{background:rgba(60,200,255,.35)}
  @media (pointer:coarse){.tc{display:grid}}
  .menu{display:grid;grid-template-columns:repeat(2,minmax(0,210px));gap:12px;margin:30px 0 20px;pointer-events:auto}
  .menu button,.hbtn{font:inherit;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:#fff;cursor:pointer;
    padding:14px 10px;border-radius:10px;border:1px solid var(--glow);background:rgba(10,14,44,.85);box-shadow:inset 0 0 18px -8px var(--glow)}
  .menu button:hover,.hbtn:hover{box-shadow:0 0 22px -2px var(--glow),inset 0 0 22px -6px var(--glow)}
  .hbtn{position:fixed;right:16px;bottom:12px;padding:9px 14px;font-size:11px;z-index:5}
  .hbtn.on{background:var(--glow2);color:#02000a}
  :root{--glow:#3df;--glow2:#f4d}
</style>
</head>
<body>
<div id="hud">
  <div><span id="l0"></span><b id="v0"></b></div><div><span id="l1"></span><b id="v1"></b></div>
  <div><span id="l2"></span><b id="v2"></b></div><div><span id="l3"></span><b id="v3"></b></div>
</div>
<div id="msg"></div>
<div id="pause">PAUSED</div>
<a id="back" href="index.html">&larr; games</a>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
'use strict';
/* ================= shared engine: renderer, bloom, particles, audio, input ================= */
const $=id=>document.getElementById(id);
const setMsg=h=>{$('msg').innerHTML=h;};
const setHud=a=>a.forEach((p,i)=>{$('l'+i).textContent=p[0];$('v'+i).textContent=p[1];});
if(!window.THREE){setMsg('<h2>OFFLINE</h2><p>three.js could not be loaded — check your internet connection</p>');throw new Error('three.js missing');}
const rnd=n=>Math.floor(Math.random()*n),rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x02000a);
const camera=new THREE.PerspectiveCamera(50,1,0.1,600);
const cam={pos:new THREE.Vector3(0,0,30),look:new THREE.Vector3(),shake:0};
let onResize=null,onKeyDown=null,onTap=null,muted=false,paused=false;

const dotTex=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');
  const g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'#fff');g.addColorStop(0.3,'rgba(255,255,255,.7)');
  g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);})();

const stars=(()=>{const n=2200,p=new Float32Array(n*3),c=new Float32Array(n*3),col=new THREE.Color();
  for(let i=0;i<n;i++){const r=140+Math.random()*140,a=Math.random()*Math.PI*2,e=Math.asin(Math.random()*2-1);
    p[i*3]=Math.cos(a)*Math.cos(e)*r;p[i*3+1]=Math.sin(e)*r;p[i*3+2]=Math.sin(a)*Math.cos(e)*r;
    col.setHSL(0.5+Math.random()*0.35,0.8,0.5+Math.random()*0.4);c[i*3]=col.r;c[i*3+1]=col.g;c[i*3+2]=col.b;}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));
  g.setAttribute('color',new THREE.BufferAttribute(c,3));
  const s=new THREE.Points(g,new THREE.PointsMaterial({size:2.2,map:dotTex,vertexColors:true,transparent:true,
    blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
  scene.add(s);return s;})();

const PN=1400,pPos=new Float32Array(PN*3),pCol=new Float32Array(PN*3),pVel=new Float32Array(PN*3),
  pBase=new Float32Array(PN*3),pLife=new Float32Array(PN),pMax=new Float32Array(PN);
let pNext=0,pGrav=0;
for(let i=0;i<PN;i++)pPos[i*3+1]=-999;
const pGeo=new THREE.BufferGeometry();
pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
pGeo.setAttribute('color',new THREE.BufferAttribute(pCol,3));
const pPoints=new THREE.Points(pGeo,new THREE.PointsMaterial({size:0.5,map:dotTex,vertexColors:true,transparent:true,
  blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
pPoints.frustumCulled=false;scene.add(pPoints);
const tmpC=new THREE.Color();
function emit(x,y,z,color,n,speed,life){
  tmpC.set(color);
  for(let k=0;k<n;k++){
    const i=pNext;pNext=(pNext+1)%PN;
    const a=Math.random()*Math.PI*2,e=Math.asin(Math.random()*2-1),s=speed*(0.25+Math.random()*0.75);
    pPos[i*3]=x;pPos[i*3+1]=y;pPos[i*3+2]=z;
    pVel[i*3]=Math.cos(a)*Math.cos(e)*s;pVel[i*3+1]=Math.sin(e)*s;pVel[i*3+2]=Math.sin(a)*Math.cos(e)*s;
    pBase[i*3]=tmpC.r;pBase[i*3+1]=tmpC.g;pBase[i*3+2]=tmpC.b;
    pLife[i]=pMax[i]=life*(0.5+Math.random()*0.5);
  }
}
function updateParticles(dt){
  const damp=Math.pow(0.1,dt);
  for(let i=0;i<PN;i++){
    if(pLife[i]<=0)continue;
    pLife[i]-=dt;const j=i*3;
    if(pLife[i]<=0){pPos[j+1]=-999;pCol[j]=pCol[j+1]=pCol[j+2]=0;continue;}
    pVel[j+1]-=pGrav*dt;
    pPos[j]+=pVel[j]*dt;pPos[j+1]+=pVel[j+1]*dt;pPos[j+2]+=pVel[j+2]*dt;
    pVel[j]*=damp;pVel[j+1]*=damp;pVel[j+2]*=damp;
    const f=pLife[i]/pMax[i];
    pCol[j]=pBase[j]*f;pCol[j+1]=pBase[j+1]*f;pCol[j+2]=pBase[j+2]*f;
  }
  pGeo.attributes.position.needsUpdate=true;pGeo.attributes.color.needsUpdate=true;
}

let composer=null,bloom=null;
if(THREE.EffectComposer&&THREE.UnrealBloomPass&&THREE.RenderPass){
  try{
    composer=new THREE.EffectComposer(renderer);
    composer.addPass(new THREE.RenderPass(scene,camera));
    bloom=new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.85,0.5,0.32);
    composer.addPass(bloom);
  }catch(e){composer=null;}
}
function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h);if(composer)composer.setSize(w,h);
  camera.aspect=w/h;camera.updateProjectionMatrix();
  if(onResize)onResize(camera.aspect);
}
addEventListener('resize',resize);

let actx=null;
function audioInit(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(actx&&actx.state==='suspended')actx.resume();}
function tone(f,dur,type,vol,slide){
  if(!actx||muted)return;
  const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(vol||0.08,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+dur+0.02);
}

const keys={};
const pointer={nx:0,ny:0,down:false,moved:false};
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
  audioInit();
  if(k==='p'){paused=!paused;$('pause').style.display=paused?'flex':'none';return;}
  if(k==='m'){muted=!muted;return;}
  const first=!keys[k];keys[k]=true;
  if(onKeyDown&&first&&!paused)onKeyDown(k,e);
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
function setPointer(e){pointer.nx=e.clientX/innerWidth*2-1;pointer.ny=-(e.clientY/innerHeight)*2+1;pointer.moved=true;}
addEventListener('pointermove',setPointer);
addEventListener('pointerdown',e=>{
  if(e.target.closest&&e.target.closest('a,button'))return;
  audioInit();setPointer(e);pointer.down=true;if(onTap&&!paused)onTap(e);
});
addEventListener('pointerup',()=>{pointer.down=false;});
addEventListener('pointercancel',()=>{pointer.down=false;});
const _ray=new THREE.Raycaster(),_v2=new THREE.Vector2(),_hit=new THREE.Vector3();
function pointerOn(plane){_v2.set(pointer.nx,pointer.ny);_ray.setFromCamera(_v2,camera);return _ray.ray.intersectPlane(plane,_hit);}

const _pv=new THREE.Vector3();
function popup(text,x,y,z,color){
  _pv.set(x,y,z).project(camera);
  const el=document.createElement('div');el.className='pop';el.textContent=text;el.style.color=color||'#fff';
  el.style.left=((_pv.x+1)/2*innerWidth)+'px';el.style.top=((1-_pv.y)/2*innerHeight)+'px';
  document.body.appendChild(el);setTimeout(()=>el.remove(),1000);
}
function loadBest(key){try{return +localStorage.getItem(key)||0;}catch(e){return 0;}}
function saveBest(key,v){try{localStorage.setItem(key,v);}catch(e){}}
const hex=c=>'#'+c.toString(16).padStart(6,'0');

// on-screen buttons for touch devices; each one drives a key
function touchKeys(left,right){
  const mk=(arr,cls)=>{if(!arr||!arr.length)return;const d=document.createElement('div');d.className='tc '+cls;
    arr.forEach(([k,l,area])=>{const b=document.createElement('button');b.textContent=l;if(area)b.style.gridArea=area;
      const dn=e=>{e.preventDefault();audioInit();if(!keys[k]){keys[k]=true;if(onKeyDown&&!paused)onKeyDown(k,e);}};
      const up=e=>{e.preventDefault();keys[k]=false;};
      b.addEventListener('pointerdown',dn);b.addEventListener('pointerup',up);
      b.addEventListener('pointerleave',up);b.addEventListener('pointercancel',up);d.appendChild(b);});
    document.body.appendChild(d);};
  mk(left,'tl');mk(right,'tr');
}
const DPAD=[['arrowup','▲','1/2'],['arrowleft','◀','2/1'],['arrowdown','▼','2/2'],['arrowright','▶','2/3']];
const LR=[['arrowleft','◀','1/1'],['arrowright','▶','1/3']];
const coarse=matchMedia('(pointer:coarse)').matches;

function run(update){
  let last=performance.now(),t=0;
  function frame(now){
    requestAnimationFrame(frame);
    const dt=Math.min(0.05,(now-last)/1000);last=now;
    if(!paused){t+=dt;update(dt,t);updateParticles(dt);stars.rotation.y=t*0.006;}
    camera.position.copy(cam.pos);
    if(cam.shake>0){cam.shake=Math.max(0,cam.shake-dt);
      camera.position.x+=(Math.random()-0.5)*cam.shake;camera.position.y+=(Math.random()-0.5)*cam.shake;}
    camera.lookAt(cam.look);
    if(composer)composer.render();else renderer.render(scene,camera);
  }
  resize();requestAnimationFrame(frame);
}

/* ================= VAULT RAID — fly a rescue chopper down into a buried vault: blast through, lift the captives out, blow the core ================= */
const KEY='vaultraid_best';let best=loadBest(KEY);
const W=64,H=36,SR=5,LY=[9,16,23,30],LH=4;   // SR: surface row; LY: top row of each cavern layer
let state='title',score=0,lives=3,level=1,bannerT=0,deadT=0,fuel=100,saved=0,aboard=0,total=0,escapeT=0,coreDead=false,fireT=0,bombT=0,camZ=14;
let map=new Uint8Array(W*H),shafts=[],pad=[0,0],depot=[0,0,0],rockMesh=null,softMesh=null,softIdx=new Map(),extras=[];
let captives=[],turrets=[],drones=[],lasers=[],shots=[],bombs=[],bolts=[],core=null;
const T=(c,r)=>c<0||c>=W||r>=H||r<0?1:map[c+r*W];   // 0 open, 1 rock, 2 soft wall
const solidAt=(x,y)=>T(Math.floor(x),Math.floor(-y))>0;

scene.add(new THREE.AmbientLight(0x667799,0.9));
const dl=new THREE.DirectionalLight(0xffffff,0.6);dl.position.set(-3,6,10);scene.add(dl);
onResize=a=>{camZ=Math.max(14.5,13/a);};
const me={x:0,y:0,vx:0,vy:0,face:1,landed:false,g:new THREE.Group()};
{const mat=new THREE.MeshStandardMaterial({color:0x7ff6ff,emissive:0x22ccff,emissiveIntensity:0.8,flatShading:true});
  const b=new THREE.Mesh(new THREE.OctahedronGeometry(0.34),mat);b.scale.set(1.5,0.9,0.9);me.g.add(b);
  const tail=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.08,0.08),mat);tail.position.set(-0.6,0.05,0);me.g.add(tail);
  me.rotor=new THREE.Mesh(new THREE.BoxGeometry(1.3,0.04,0.12),new THREE.MeshBasicMaterial({color:0xffffff}));me.rotor.position.y=0.36;me.g.add(me.rotor);
  for(const s of [-1,1]){const k=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.04,0.04),mat);k.position.set(0,-0.34,s*0.2);me.g.add(k);}scene.add(me.g);}
const ml=new THREE.PointLight(0x9fe8ff,1.2,9,2);scene.add(ml);
const boxGeo=new THREE.BoxGeometry(1,1,1.6),capGeo=new THREE.CylinderGeometry(0.13,0.13,0.55,8),turGeo=new THREE.ConeGeometry(0.34,0.6,5),droneGeo=new THREE.OctahedronGeometry(0.36),
  shotGeo=new THREE.BoxGeometry(0.4,0.07,0.07),bombGeo=new THREE.SphereGeometry(0.14,8,6),boltGeo=new THREE.SphereGeometry(0.11,8,6);
const capMat=new THREE.MeshBasicMaterial({color:0x8dff5a}),turMat=new THREE.MeshStandardMaterial({color:0xff5a4f,emissive:0xff5a4f,emissiveIntensity:0.5,flatShading:true}),
  droneMat=new THREE.MeshStandardMaterial({color:0xffd34f,emissive:0xffd34f,emissiveIntensity:0.5,flatShading:true}),shotMat=new THREE.MeshBasicMaterial({color:0xffffff}),
  bombMat=new THREE.MeshBasicMaterial({color:0xffa040}),boltMat=new THREE.MeshBasicMaterial({color:0xff6a5a}),laserMat=new THREE.MeshBasicMaterial({color:0xff3f6f}),padMat=new THREE.MeshBasicMaterial({color:0x8dff5a});
const add=m=>{scene.add(m);extras.push(m);return m;};
function generate(){
  extras.forEach(m=>scene.remove(m));extras=[];[shots,bombs,bolts].forEach(a=>{a.forEach(o=>scene.remove(o.mesh));a.length=0;});
  if(rockMesh){scene.remove(rockMesh);scene.remove(softMesh);rockMesh.dispose&&rockMesh.dispose();}
  map.fill(1);for(let r=0;r<SR;r++)for(let c=0;c<W;c++)map[c+r*W]=0;
  const carve=(c0,c1,r0,r1,v)=>{for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)map[c+r*W]=v||0;};
  shafts=[20+rnd(24)];for(let i=1;i<4;i++)shafts.push(shafts[i-1]<W/2?W-14+rnd(8):5+rnd(8));
  LY.forEach(y=>carve(2,W-3,y,y+LH-1));
  carve(shafts[0],shafts[0]+2,SR,LY[0]-1);for(let i=1;i<4;i++)carve(shafts[i],shafts[i]+2,LY[i-1]+LH,LY[i]-1);
  const nearShaft=(i,c,d)=>Math.abs(c-shafts[i]-1)<d||(i<3&&Math.abs(c-shafts[i+1]-1)<d);
  captives=[];turrets=[];drones=[];lasers=[];
  LY.forEach((y,i)=>{
    for(let c=8+rnd(5);c<W-8;c+=9+rnd(5))if(!nearShaft(i,c,4))carve(c,c+rnd(2),y,y+LH-1,2);            // soft walls to blast through
    for(let k=0;k<7;k++){const c=3+rnd(W-6);if(!nearShaft(i,c,3)&&!map[c+y*W]){map[c+y*W]=1;if(Math.random()<0.4)map[c+(y+1)*W]=1;}}   // stalactites
    for(let k=0,n=0;k<2&&n<80;n++){const c=4+rnd(W-8);if(map[c+(y+LH-1)*W]||!map[c+(y+LH)*W]||nearShaft(i,c,3)||captives.some(q=>q.layer===i&&Math.abs(q.x-c)<5))continue;
      captives.push({x:c+0.5,y:-(y+LH),layer:i,mode:'wait',mesh:add(new THREE.Mesh(capGeo,capMat))});k++;}
    for(let k=0,n=0;k<Math.min(3,1+(level>>1))&&n<80;n++){const c=4+rnd(W-8),top=Math.random()<0.5,r=top?y:y+LH-1;
      if(map[c+r*W]||nearShaft(i,c,5)||captives.some(q=>q.layer===i&&Math.abs(q.x-c)<2))continue;
      const m=add(new THREE.Mesh(turGeo,turMat));if(top)m.rotation.z=Math.PI;turrets.push({x:c+0.5,y:-(r+(top?0.3:0.7)),cd:rand(1,3),mesh:m});k++;}
    for(let k=0,n=0;k<(i||level>1?1:0)&&n<80;n++){const c=5+rnd(W-10);if(map[c+(y+1)*W]||nearShaft(i,c,5))continue;drones.push({x:c+0.5,y:-(y+1.5),dir:1,mesh:add(new THREE.Mesh(droneGeo,droneMat))});k++;}
    if(i>0||level>1){const r=i?LY[i-1]+LH+1:SR+2,m=add(new THREE.Mesh(new THREE.BoxGeometry(3,0.1,0.3),laserMat));m.position.set(shafts[i]+1.5,-(r+0.5),0);lasers.push({x:shafts[i],r,ph:rand(0,3),mesh:m});}
  });
  const cx=shafts[3]<W/2?W-7:5,cy=LY[3]+1;carve(cx-2,cx+3,LY[3],LY[3]+LH-1);
  core={x:cx+1,y:-(cy+1),hp:8+level*2,mesh:add(new THREE.Mesh(new THREE.IcosahedronGeometry(1.1,0),new THREE.MeshStandardMaterial({color:0xb07cff,emissive:0xb07cff,emissiveIntensity:0.7,flatShading:true})))};
  core.mesh.position.set(core.x,core.y,0);coreDead=false;escapeT=0;
  pad=[shafts[0]-7,shafts[0]-3];let dc=20+rnd(20);while(nearShaft(1,dc,5)||map[dc+(LY[1]+LH-1)*W]||map[dc+2+(LY[1]+LH-1)*W])dc=4+rnd(W-10);depot=[dc,dc+2,LY[1]+LH];
  for(const [c0,c1,r] of [[pad[0],pad[1],SR],depot]){const m=add(new THREE.Mesh(new THREE.BoxGeometry(c1-c0+1,0.12,1.7),padMat));m.position.set((c0+c1+1)/2,-r+0.05,0);}
  // instanced tiles: rock facing open space is drawn brighter than buried rock
  let nr=0,ns=0;for(let i=0;i<W*H;i++){if(map[i]===1)nr++;else if(map[i]===2)ns++;}
  const hue=(0.62+level*0.11)%1,rockMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.8,flatShading:true});
  rockMesh=new THREE.InstancedMesh(boxGeo,rockMat,nr);softMesh=new THREE.InstancedMesh(boxGeo,new THREE.MeshStandardMaterial({color:0xa02a78,emissive:0xff4fd8,emissiveIntensity:0.25,roughness:0.6}),ns);
  const mtx=new THREE.Matrix4(),col=new THREE.Color();softIdx=new Map();let ir=0,is=0;
  for(let r=0;r<H;r++)for(let c=0;c<W;c++){const v=map[c+r*W];if(!v)continue;mtx.makeTranslation(c+0.5,-(r+0.5),0);
    if(v===2){softIdx.set(c+r*W,is);softMesh.setMatrixAt(is++,mtx);continue;}
    let edge=false;for(let d=0;d<4;d++){const q=T(c+[1,-1,0,0][d],r+[0,0,1,-1][d]);if(q!==1)edge=true;}
    col.setHSL(hue,0.85,edge?0.2:0.07);rockMesh.setColorAt(ir,col);rockMesh.setMatrixAt(ir++,mtx);}
  rockMesh.instanceColor.needsUpdate=true;rockMesh.frustumCulled=softMesh.frustumCulled=false;scene.add(rockMesh);scene.add(softMesh);
  total=captives.length;saved=0;aboard=0;respawn();
}
function respawn(){me.x=(pad[0]+pad[1]+1)/2;me.y=-SR+0.42;me.vx=me.vy=0;me.face=1;me.g.visible=true;fuel=100;aboard=0;}
function blast(c,r){const i=c+r*W;if(map[i]!==2)return false;map[i]=0;softMesh.setMatrixAt(softIdx.get(i),new THREE.Matrix4().makeScale(0,0,0));softMesh.instanceMatrix.needsUpdate=true;
  emit(c+0.5,-(r+0.5),0.3,0xff4fd8,14,5,0.6);score+=10;return true;}
function hud(){if(score>best){best=score;saveBest(KEY,best);}
  setHud([['Score',score],['Fuel · Lives',Math.ceil(fuel)+'% · '+(lives>0?'◆'.repeat(lives):'–')],['Rescued',saved+(aboard?' +'+aboard:'')+' / '+total],escapeT>0?['Get out',Math.ceil(escapeT)+'s']:['Best',best]]);}
function newGame(){score=0;lives=3;level=1;generate();deadT=0;state='play';hud();setMsg('<h2>VAULT 1</h2><p>lift the captives out · destroy the core</p>');bannerT=2.2;}
function crash(why){if(deadT>0)return;lives--;deadT=1.8;me.g.visible=false;cam.shake=0.8;emit(me.x,me.y,0,0x7ff6ff,70,9,1.2);emit(me.x,me.y,0,0xffa040,50,6,1);tone(200,0.9,'sawtooth',0.13,40);
  captives.forEach(q=>{if(q.mode==='aboard')q.mode='lost';});aboard=0;if(why){setMsg('<h2>'+why+'</h2>');bannerT=1.6;}hud();}
function kill(list,o,pts,col){o.dead=true;scene.remove(o.mesh);score+=pts;emit(o.x,o.y,0.2,col,30,7,0.8);tone(300,0.15,'triangle',0.08,90);cam.shake=Math.max(cam.shake,0.15);hud();}
function hitCore(n,x,y){if(coreDead)return;core.hp-=n;emit(x,y,0.5,0xffffff,6,4,0.4);tone(500,0.05,'square',0.05);
  if(core.hp<=0){coreDead=true;scene.remove(core.mesh);score+=2000;escapeT=Math.max(35,60-level*3);emit(core.x,core.y,0,0xb07cff,200,12,1.8);cam.shake=1.2;tone(70,1.5,'sawtooth',0.15,25);
    setMsg('<h2>CORE DESTROYED</h2><p>get back to the surface pad</p>');bannerT=2.4;hud();}}
onKeyDown=k=>{if(state!=='play'&&(k===' '||k==='enter'))newGame();};
onTap=()=>{if(state!=='play')newGame();};
touchKeys(DPAD,[['b','▼'],[' ','●']]);
const boxHit=(x,y)=>solidAt(x-0.55,y-0.36)||solidAt(x+0.55,y-0.36)||solidAt(x-0.55,y+0.3)||solidAt(x+0.55,y+0.3)||solidAt(x,y-0.36)||solidAt(x,y+0.3);
function update(dt,t){
  if(bannerT>0){bannerT-=dt;if(bannerT<=0&&state==='play')setMsg('');}
  if(state==='play'){
    if(deadT>0){deadT-=dt;if(deadT<=0){if(lives<=0){state='over';setMsg('<h2>GAME OVER</h2><p>vault '+level+' · score '+score+'</p><p class="blink">space / tap to play again</p>');}
      else{if(escapeT<0){generate();}else respawn();hud();}}}
    else{
      const ix=((keys['arrowright']||keys['d'])?1:0)-((keys['arrowleft']||keys['a'])?1:0),iy=((keys['arrowup']||keys['w'])?1:0)-((keys['arrowdown']||keys['s'])?1:0);
      if(ix)me.face=ix;const k=Math.min(1,dt*4);
      if(fuel>0){me.vx+=(ix*7.5-me.vx)*k;me.vy+=(iy*6.5-(iy?0:0.9)-me.vy)*k;}else{me.vx*=Math.pow(0.5,dt);me.vy-=9*dt;}
      me.landed=false;
      const nx=me.x+me.vx*dt;if(boxHit(nx,me.y)){if(Math.abs(me.vx)>5.4)crash('TOO FAST');me.vx=0;}else me.x=nx;
      const ny=me.y+me.vy*dt;if(boxHit(me.x,ny)){if(Math.abs(me.vy)>5.4||fuel<=0)crash(fuel<=0?'OUT OF FUEL':'TOO FAST');else if(me.vy<0)me.landed=true;me.vy=0;}else me.y=ny;
      if(me.y>-0.6){me.y=-0.6;me.vy=Math.min(0,me.vy);}
      const row=Math.floor(-(me.y-0.5)),onPad=me.landed&&row===SR&&me.x>=pad[0]&&me.x<=pad[1]+1,onDepot=me.landed&&row===depot[2]&&me.x>=depot[0]&&me.x<=depot[1]+1;
      const f0=Math.ceil(fuel);if(onPad||onDepot)fuel=Math.min(100,fuel+45*dt);else fuel=Math.max(0,fuel-(1.35+level*0.1)*dt);if(Math.ceil(fuel)!==f0)hud();
      if(onPad&&aboard){saved+=aboard;score+=aboard*500;popup('+'+aboard*500,me.x,me.y+1.2,0,'#8dff5a');aboard=0;captives.forEach(q=>{if(q.mode==='aboard')q.mode='saved';});
        [659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,0.14,'square',0.07),i*90));hud();}
      if(onPad&&coreDead){const bonus=saved*300+Math.ceil(escapeT)*25;score+=bonus;level++;setMsg('<h2>VAULT CLEARED</h2><p>'+saved+' of '+total+' rescued · bonus '+bonus+'</p>');bannerT=2.6;
        [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,0.16,'square',0.07),i*110));generate();hud();}
      fireT-=dt;bombT-=dt;
      if((keys[' ']||keys['x'])&&fireT<=0){fireT=0.2;const m=new THREE.Mesh(shotGeo,shotMat);scene.add(m);shots.push({x:me.x+me.face*0.7,y:me.y,vx:me.face*17+me.vx,life:0.7,mesh:m});tone(880,0.04,'square',0.03,440);}
      if((keys['b']||keys['shift']||keys['c'])&&bombT<=0&&bombs.length<2){bombT=0.5;const m=new THREE.Mesh(bombGeo,bombMat);scene.add(m);bombs.push({x:me.x,y:me.y-0.5,vx:me.vx*0.6,vy:Math.min(0,me.vy)-1,mesh:m});tone(300,0.2,'sine',0.05,120);}
      if(escapeT>0){const s=Math.ceil(escapeT);escapeT-=dt;if(Math.ceil(escapeT)!==s){hud();if(escapeT<10)tone(660,0.05,'square',0.05);}
        if(escapeT<=0){escapeT=-1;crash('THE VAULT COLLAPSED');}}
      for(const q of captives){if(q.mode==='wait'&&me.landed&&Math.abs(me.x-q.x)<5&&Math.abs(me.y-0.42-q.y)<0.6)q.mode='run';
        if(q.mode==='run'){if(!me.landed||Math.abs(me.y-0.42-q.y)>0.6)q.mode='wait';else{const nx2=q.x+Math.sign(me.x-q.x)*2.8*dt;if(!solidAt(nx2,q.y+0.3))q.x=nx2;
          if(Math.abs(me.x-q.x)<0.7){q.mode='aboard';aboard++;score+=100;tone(700,0.1,'sine',0.07,1050);hud();}}}}
      for(const l of lasers){l.on=(t+l.ph)%3<1.5;if(l.on&&me.x+0.5>l.x&&me.x-0.5<l.x+3&&Math.abs(me.y+(l.r+0.5))<0.42)crash('LASER GATE');}
      for(const d of drones){if(Math.hypot(d.x-me.x,d.y-me.y)<0.75)crash();}
      if(!coreDead&&Math.hypot(core.x-me.x,core.y-me.y)<1.5)crash();
    }
    for(const d of drones){const nx=d.x+d.dir*(2.4+level*0.2)*dt;if(solidAt(nx+d.dir*0.5,d.y))d.dir=-d.dir;else d.x=nx;d.mesh.position.set(d.x,d.y,0);d.mesh.rotation.y+=dt*4;}
    for(const u of turrets){u.cd-=dt;const dx=me.x-u.x,dy=me.y-u.y,d=Math.hypot(dx,dy);
      if(u.cd<=0&&d<11&&deadT<=0){u.cd=Math.max(1.1,2.6-level*0.15)*rand(0.8,1.3);let see=true;for(let i=1;i<d/0.4;i++)if(solidAt(u.x+dx*i*0.4/d,u.y+dy*i*0.4/d)){see=false;break;}
        if(see){const m=new THREE.Mesh(boltGeo,boltMat);scene.add(m);const s=5.5+level*0.3;bolts.push({x:u.x,y:u.y,vx:dx/d*s,vy:dy/d*s,mesh:m});tone(220,0.08,'square',0.04);}}}
    for(const s of shots){s.x+=s.vx*dt;s.life-=dt;const c=Math.floor(s.x),r=Math.floor(-s.y);
      if(s.life<=0)s.dead=true;else if(T(c,r)){s.dead=true;if(blast(c,r)){tone(160,0.08,'sawtooth',0.05);hud();}}
      for(const [list,pts,col] of [[turrets,100,0xff5a4f],[drones,150,0xffd34f]])for(const o of list)if(!o.dead&&!s.dead&&Math.hypot(o.x-s.x,o.y-s.y)<0.55){s.dead=true;kill(list,o,pts,col);}
      if(!s.dead&&!coreDead&&Math.hypot(core.x-s.x,core.y-s.y)<1.2){s.dead=true;hitCore(1,s.x,s.y);}
      if(s.dead)scene.remove(s.mesh);else s.mesh.position.set(s.x,s.y,0);}
    for(const b of bombs){b.vy-=14*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;
      if(solidAt(b.x,b.y)||(!coreDead&&Math.hypot(core.x-b.x,core.y-b.y)<1.2)){b.dead=true;const c=Math.floor(b.x),r=Math.floor(-b.y);
        for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)blast(c+dc,r+dr);emit(b.x,b.y,0.3,0xffa040,40,7,0.7);tone(110,0.3,'sawtooth',0.09,50);cam.shake=Math.max(cam.shake,0.2);
        for(const [list,pts,col] of [[turrets,100,0xff5a4f],[drones,150,0xffd34f]])for(const o of list)if(!o.dead&&Math.hypot(o.x-b.x,o.y-b.y)<1.7)kill(list,o,pts,col);
        if(!coreDead&&Math.hypot(core.x-b.x,core.y-b.y)<2.2)hitCore(3,b.x,b.y);hud();}
      if(b.dead)scene.remove(b.mesh);else b.mesh.position.set(b.x,b.y,0);}
    for(const b of bolts){b.x+=b.vx*dt;b.y+=b.vy*dt;if(solidAt(b.x,b.y))b.dead=true;else if(deadT<=0&&Math.abs(b.x-me.x)<0.6&&Math.abs(b.y-me.y)<0.36){b.dead=true;crash();}
      if(b.dead)scene.remove(b.mesh);else b.mesh.position.set(b.x,b.y,0);}
    turrets=turrets.filter(o=>!o.dead);drones=drones.filter(o=>!o.dead);shots=shots.filter(o=>!o.dead);bombs=bombs.filter(o=>!o.dead);bolts=bolts.filter(o=>!o.dead);
  }
  for(const q of captives){q.mesh.visible=q.mode==='wait'||q.mode==='run';q.mesh.position.set(q.x,q.y+0.28+(q.mode==='run'?Math.abs(Math.sin(t*14))*0.12:Math.abs(Math.sin(t*3+q.x))*0.06),0.3);}
  for(const u of turrets)u.mesh.position.set(u.x,u.y,0);
  for(const l of lasers){l.mesh.visible=l.on||Math.floor(t*10)%2===0&&(t+l.ph)%3>2.6;l.mesh.scale.y=l.on?1:0.3;}
  if(core&&!coreDead){core.mesh.rotation.y+=dt;core.mesh.rotation.x+=dt*0.6;core.mesh.material.emissiveIntensity=0.6+Math.sin(t*5)*0.2;}
  me.g.position.set(me.x,me.y,0);me.g.rotation.y=me.face>0?0:Math.PI;me.g.rotation.z=-me.vx*0.04*me.face;me.rotor.rotation.y+=dt*(me.landed?8:40);
  ml.position.set(me.x,me.y,1.5);
  const k2=Math.min(1,dt*5);cam.pos.x+=(me.x+me.vx*0.3-cam.pos.x)*k2;cam.pos.y+=(me.y+0.6-cam.pos.y)*k2;cam.pos.z=camZ;cam.look.set(cam.pos.x,cam.pos.y-0.2,0);
  stars.position.set(cam.pos.x,cam.pos.y,0);
}
generate();me.g.visible=false;cam.pos.set(me.x,me.y+0.6,camZ);hud();
setMsg('<h1>VAULT RAID</h1><p>down into the vault, and out again</p><p style="margin-top:30px">arrows / W A S D to fly · space fires the gun · B drops a bomb · P pause · M mute</p><p>blast the pink walls · land beside captives to pick them up · fly them to the green surface pad · destroy the core at the bottom, then get out before the timer ends</p><p>touch down gently · green pads refuel you</p><p class="blink">press space / tap to start</p>');
run(update);
